<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142b3a">
  <title>IMS Sales & Inventory</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{--navy:#0f2333;--navy2:#1c3d4f;--teal:#0f8f83;--tealDark:#0b6b62;--mint:#d9f0ea;--bg:#eef3f1;--card:#ffffff;--line:#dde7e4;--ink:#0f2430;--muted:#6d818a;--amber:#c88b31;--red:#b23a2b}
    *{box-sizing:border-box}
    html,body{height:100%;overscroll-behavior:none}
    body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;overflow:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;-webkit-appearance:none}
    input:not([type="checkbox"]):not([type="radio"]),textarea{-webkit-appearance:none}
    select{-webkit-appearance:menulist;appearance:menulist}
    .top{height:64px;flex:0 0 auto;background:linear-gradient(135deg,var(--card),var(--mint) 180%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px;z-index:30;gap:10px}
    .top small{font-size:9.5px;letter-spacing:.15em;color:var(--tealDark);font-weight:800}
    .top h1{font-size:19px;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;color:var(--navy)}
    .primary,.outline,.dark,.danger{min-height:44px;border-radius:9px;padding:0 14px;font-weight:800;white-space:nowrap}
    .primary{background:linear-gradient(135deg,var(--teal),var(--tealDark));border:0;color:#edfffb;box-shadow:0 4px 12px rgba(15,143,131,.28)}
    .outline{background:var(--card);border:1px solid #9fb7b3;color:var(--ink)}
    .dark{background:var(--navy);border:0;color:#e7f6f3}
    .danger{background:#f6e2dd;border:1px solid #d8a996;color:#8a3822}
    .content{padding:15px;max-width:1300px;margin:auto}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}
    .hero h2{margin:0 0 5px;font-size:22px}
    .hero p{margin:0;color:var(--muted);font-size:13.5px}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px rgba(15,36,48,.06),0 1px 3px rgba(15,36,48,.05)}
    .metric{padding:14px;min-height:120px}
    .metric i{width:36px;height:36px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:var(--teal);font-style:normal;font-size:18px}
    .metric span{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
    .metric b{font-size:17px;display:block;word-break:break-word}
    .metric b.neg{color:var(--red)}
    .metric small{color:#849397}
    .report-tile{min-height:150px;display:flex;flex-direction:column}
    .report-tile .report-subject{min-height:32px}
    .report-tile.t0 i{background:#d9f0ea;color:#0f8f83}
    .report-tile.t1 i{background:#dde9f7;color:#1e5fa8}
    .report-tile.t2 i{background:#f7e6cf;color:#b5751f}
    .report-tile.t3 i{background:#e6dcf3;color:#6a3ea3}
    .report-tile.t4 i{background:#fbe1de;color:#b23a2b}
    .report-tile.t5 i{background:#d7ecec;color:#0b6b62}
    .report-tile.t6 i{background:#eef0d8;color:#7a8a1f}
    .report-tile.t7 i{background:#f3dce8;color:#a3306f}
    .report-subject{display:block;color:var(--navy);font-size:17px;font-weight:800;margin:10px 0 5px}
    .panel{margin-top:13px;padding:15px}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
    .panel-head h3{margin:0 0 4px;font-size:16.5px}
    .panel-head p{margin:0;color:var(--muted);font-size:12.5px}
    .table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:640px;border-collapse:collapse}
    th{padding:10px;text-align:left;background:#e6eeec;color:#6f8387;text-transform:uppercase;font-size:9.5px;letter-spacing:.06em;white-space:nowrap}
    td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;color:#546a70}
    td b{color:var(--ink)}
    tr.total-row td{font-weight:800;color:var(--ink);background:#e9f2ef}
    .edit{border:1px solid #96b7b0;background:var(--mint);color:#0d6961;border-radius:7px;padding:7px 9px;font-size:11.5px;font-weight:800;margin:2px}
    .del{border:1px solid #d8a996;background:#f6e2dd;color:#8a3822;border-radius:7px;padding:7px 9px;font-size:11.5px;font-weight:800;margin:2px}
    .empty{text-align:center;padding:45px 20px;color:var(--muted)}
    .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
    .status{padding:5px 8px;border-radius:20px;font-size:10.5px;font-weight:800;white-space:nowrap}
    .good{background:#d5ece6;color:#087165}
    .bad{background:#f1dfc2;color:#8b5d1b}
    .low{background:#f6e2dd;color:#8a3822}
    .credit{background:#fbe1de;color:var(--red)}
    .credit-text{color:var(--red);font-weight:800}
    .nav{flex:0 0 auto;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,var(--navy2),var(--navy));display:flex;overflow-x:auto;z-index:20;-webkit-overflow-scrolling:touch;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
    main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .nav button{min-width:68px;flex:1 0 auto;border:0;background:transparent;color:#8ba5ab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-bottom:4px;transition:color .15s;position:relative}
    .nav button.active{color:#39ff8f}
    .nav button.active span{text-shadow:0 0 6px #39ff8f,0 0 14px #39ff8f,0 0 22px rgba(57,255,143,.7);font-weight:900}
    .nav span{font-size:24px}
    .nav small{font-size:11.5px;font-weight:700}
    .chart{padding:15px;margin-top:13px}
    .chart-area{height:210px;display:flex;gap:14px;align-items:flex-end;overflow-x:auto;border-bottom:1px solid #9dafac;padding:15px 8px 0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 48px,rgba(90,115,118,.12) 49px);-webkit-overflow-scrolling:touch}
    .group{height:100%;min-width:66px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
    .pair{height:165px;display:flex;align-items:flex-end;gap:4px}
    .bar{width:21px;border-radius:5px 5px 1px 1px;min-height:5px;position:relative}
    .bar.target{background:#9fb7b3}
    .bar.actual{background:var(--teal)}
    .bar em{position:absolute;top:-16px;width:100%;text-align:center;font-size:8px;font-style:normal;font-weight:800;white-space:nowrap}
    .group>small{width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
    .progress{height:7px;background:#cbd8d5;border-radius:10px;overflow:hidden;min-width:80px}
    .progress i{display:block;height:100%;background:var(--teal)}
    dialog{border:0;padding:0;background:transparent;width:100%;max-width:720px;margin:auto 0 0;max-height:94vh}
    dialog::backdrop{background:rgba(10,28,38,.68)}
    .modal{background:var(--card);border-radius:18px 18px 0 0;padding:20px 15px;max-height:94vh;overflow:auto}
    .modal h2{margin:0 0 5px;font-size:20px}
    .modal>p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
    .close{float:right;width:34px;height:34px;border:0;border-radius:50%;font-size:20px;background:var(--mint);color:var(--ink)}
    .form{display:grid;gap:13px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    label{display:grid;gap:6px;color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    input:not([type="checkbox"]):not([type="radio"]),select,textarea{height:42px;border:1px solid #abc2bd;background:#e7efed;border-radius:8px;padding:0 10px;color:var(--ink);width:100%}
    input[type="checkbox"],input[type="radio"]{width:20px;height:20px;accent-color:var(--teal);cursor:pointer}
    textarea{height:80px;padding-top:10px}
    .auto{background:var(--mint);font-weight:800;color:#0e665f}
    .hint{font-size:12px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
    .err{color:var(--red);font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
    .line-editor{border:1px solid var(--line);border-radius:10px;padding:10px}
    .line{display:grid;grid-template-columns:1fr 60px 82px 32px;gap:6px;margin-bottom:7px}
    .line button{border:0;border-radius:7px;background:#f6e2dd;color:#8a3822;font-weight:800}
    .total{display:flex;justify-content:space-between;background:var(--navy);color:#e8faf7;border-radius:8px;padding:14px;margin-top:10px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:-20px;background:var(--card);padding:12px 0 18px}
    .toast{position:fixed;bottom:calc(94px + env(safe-area-inset-bottom));left:14px;right:14px;background:var(--navy);color:#e8faf7;padding:13px;border-radius:10px;text-align:center;z-index:50;font-size:13.5px}
    .toast.err-toast{background:#7a2c1c}
    .desktop{display:none}
    .settings-grid{display:grid;gap:12px}
    .legend{font-size:12px;color:var(--muted)}
    .pnl-section{margin-top:18px}
    .pnl-section h4{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal)}
    .logo-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
    .logo-preview{width:72px;height:72px;border-radius:12px;background:var(--mint);border:1px dashed #9fb7b3;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
    .logo-preview img{width:100%;height:100%;object-fit:contain}
    .logo-preview span{font-size:10.5px;color:var(--muted);text-align:center;padding:4px}
    .logo-actions{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
    .logo-upload-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border-radius:8px;background:var(--teal);color:#edfffb;font-weight:800;font-size:13.5px;padding:0 14px;cursor:pointer;width:fit-content}
    .pnl-row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
    .pnl-row.sub{padding-left:14px;color:var(--muted);font-size:13px}
    .pnl-row.subtotal{font-weight:800;color:var(--ink);border-bottom:2px solid var(--line)}
    .pnl-row.grand{font-weight:900;font-size:16px;background:var(--navy);color:#e8faf7;border-radius:8px;padding:12px;border:0;margin-top:6px}
    .pnl-row.grand.neg{background:var(--red)}
    .badge-count{background:var(--mint);color:var(--teal);border-radius:20px;padding:2px 8px;font-size:10.5px;font-weight:800}
    .portrait-preview{max-width:420px;margin:0 auto;aspect-ratio:1/1.35;overflow-y:auto;padding:4px}
    @media(min-width:800px){
      body{padding:0 0 0 220px}
      .desktop{display:block}
      .side{position:fixed;left:0;top:0;bottom:0;width:220px;background:linear-gradient(180deg,var(--navy2),var(--navy));padding:24px 15px;color:#d8e8e6;overflow-y:auto}
      .brand{font-size:19px;font-weight:900;margin:0 10px 30px}
      .side button{display:flex;width:100%;border:0;background:transparent;color:#adc2c6;padding:12px;border-radius:9px;margin-bottom:4px;text-align:left}
      .side button.active{background:var(--navy2);color:#79dfd0}
      .nav{display:none}
      .top{height:78px;padding:0 28px}
      .content{padding:25px 28px}
      .cards{grid-template-columns:repeat(4,1fr)}
      .metric{min-height:115px}
      .report-tile{min-height:150px}
      .grid{grid-template-columns:1fr 1fr}
      dialog{margin:auto;max-width:760px}
      .modal{border-radius:16px;padding:24px}
      .settings-grid{grid-template-columns:1fr 1fr}
      .chart-area{height:250px}
      .pair{height:200px}
    }
  </style>
</head>
<body>
  <aside class="side desktop"><div class="brand">IMS<br><small>Business Manager</small></div><div id="sideNav"></div></aside>
  <header class="top"><div><small>BUSINESS WORKSPACE</small><h1 id="pageTitle">Dashboard</h1></div><button class="primary" onclick="openInvoice()">＋ Invoice</button></header>
  <main id="app"></main>
  <nav class="nav" id="mobileNav"></nav>
  <dialog id="dialog"><div class="modal" id="modal"></div></dialog>
  <div id="toast" class="toast" hidden></div>
  <script>
  const tabs=[['dashboard','▦','Dashboard'],['invoices','▤','Invoices'],['vendors','◇','Vendors'],['purchases','↓','Purchasing'],['inventory','□','Inventory'],['returns','↺','Returns'],['expenses','＄','Expenses'],['targets','◎','Targets'],['reports','↗','Reports'],['settings','⚙','Settings']];
  const DEFAULT_EXPENSE_CATEGORIES=['Rent','Salaries & Wages','Utilities (Electricity/Water)','Transport & Fuel','Communication','Marketing & Advertising','Repairs & Maintenance','Office Supplies','Bank Charges & Fees','Taxes & Licenses','Other'];
  const SL_BANKS=['Amana Bank PLC','Bank of Ceylon','Bank of China Limited','Cargills Bank PLC','Citibank N.A.','Commercial Bank of Ceylon PLC','Deutsche Bank AG','DFCC Bank PLC','Habib Bank Ltd','Hatton National Bank PLC','Housing Development Finance Corporation Bank of Sri Lanka (HDFC)','Indian Bank','Indian Overseas Bank','MCB Bank Ltd','National Development Bank PLC','National Savings Bank','Nations Trust Bank PLC','Pan Asia Banking Corporation PLC',"People's Bank",'Pradeshiya Sanwardhana Bank','Public Bank Berhad','Sampath Bank PLC','Sanasa Development Bank PLC','Seylan Bank PLC','Standard Chartered Bank','State Bank of India','State Mortgage & Investment Bank','The Hongkong & Shanghai Banking Corporation Ltd (HSBC)','Union Bank of Colombo PLC','Other'];
  // Licensed Commercial Banks only (per CBSL) — these are the banks permitted to maintain current
  // accounts and issue chequebooks in Sri Lanka. Licensed Specialised Banks (National Savings Bank,
  // HDFC, State Mortgage & Investment Bank, Pradeshiya Sanwardhana Bank, Sanasa Development Bank)
  // are intentionally excluded since they don't offer standard current/cheque accounts.
  const SL_CURRENT_ACCOUNT_BANKS=['Amana Bank PLC','Bank of Ceylon','Bank of China Limited','Cargills Bank PLC','Citibank N.A.','Commercial Bank of Ceylon PLC','Deutsche Bank AG','DFCC Bank PLC','Habib Bank Ltd','Hatton National Bank PLC','Indian Bank','Indian Overseas Bank','MCB Bank Ltd','National Development Bank PLC','Nations Trust Bank PLC','Pan Asia Banking Corporation PLC',"People's Bank",'Public Bank Berhad','Sampath Bank PLC','Seylan Bank PLC','Standard Chartered Bank','State Bank of India','The Hongkong & Shanghai Banking Corporation Ltd (HSBC)','Union Bank of Colombo PLC'];
  const REPORT_ICONS={'Invoices':'▤','Payment Details':'💳','Customers':'◇','Vendors':'⌂','Purchase Orders':'↓','Inventory':'□','Batches':'▥','Returns':'↺','Expenses':'＄','Target vs Achievement':'◎','Activity History':'☰'};
  const STORAGE_KEY='ims_mobile_data_v2';
  const CHART_PALETTE=[['#a9c8f0','#1e6bd6'],['#b9e3d8','#0f8f6b'],['#f6cf9e','#c8781f'],['#e3b9dd','#9b2ea3'],['#f4b8b8','#d62e2e'],['#c7c2f0','#5c3ed6'],['#a9e3e0','#0f9490'],['#f0d9a9','#c89a1f']];
  const fresh={company:{name:'',address:'',br:'',phone:'',logo:'',qrCode:'',printerWidth:'58',printerName:'',printerNote:'',printHeaderFooter:true,customHeader:'',customFooter:'',customFooter2:'',customFooter3:''},retailers:[],vendors:[],products:[],purchases:[],invoices:[],returns:[],expenses:[],expenseCategories:[],targets:[],batches:[],audit:[]};
  let state=loadState(),tab='dashboard',editor=[],_currentVendorEditId='';
  const EXPENSE_CATEGORIES=()=>[...DEFAULT_EXPENSE_CATEGORIES,...(state.expenseCategories||[])];

  function loadState(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      const parsed=raw?JSON.parse(raw):null;
      const s=parsed&&typeof parsed==='object'?parsed:structuredClone(fresh);
      Object.keys(fresh).forEach(k=>{if(s[k]===undefined)s[k]=structuredClone(fresh[k])});
      migrateStockToBatches(s);
      return s;
    }catch(e){
      console.error('State load failed, starting fresh:',e);
      return structuredClone(fresh);
    }
  }
  // Self-healing migration: some products can end up with a stock quantity that has no matching
  // batch record (e.g. data saved by an earlier version of the app before batch tracking existed,
  // or a batch that was edited/removed inconsistently). Since invoicing now reads stock exclusively
  // from batches, such products would show correct stock in Inventory but fail with "No stock
  // batches available" when trying to invoice them. Fix this by creating one synthetic "Legacy
  // Stock" batch for the untracked quantity, so the product becomes invoiceable again without
  // losing or duplicating any stock.
  function migrateStockToBatches(s){
    if(!Array.isArray(s.products)||!Array.isArray(s.batches))return;
    s.products.forEach(p=>{
      const trackedQty=s.batches.filter(b=>b.productName===p.name).reduce((sum,b)=>sum+b.remainingQty,0);
      const untracked=(p.stock||0)-trackedQty;
      if(untracked>0){
        s.batches.push({
          batchNo:'LEGACY-'+p.id,
          productName:p.name,
          poId:'LEGACY',
          qty:untracked,
          remainingQty:untracked,
          rate:p.cost||0,
          date:new Date().toLocaleDateString('en-GB'),
          _migrated:true
        });
      }
    });
  }

  const $=s=>document.querySelector(s);
  const money=n=>'LKR '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
  const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};

  function persist(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
    catch(e){toast('Could not save — storage may be full',true)}
  }
  function toast(t,isErr){const e=$('#toast');e.textContent=(isErr?'⚠ ':'✓ ')+t;e.className='toast'+(isErr?' err-toast':'');e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>e.hidden=true,2600)}
  function log(module,action,record,details){state.audit.unshift({time:new Date().toLocaleString('en-GB'),module,action,record:record||'',details:details||''});if(state.audit.length>500)state.audit.length=500}
  function setTab(t){tab=t;renderNav();render()}
  function renderNav(){
    const html=tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')"><span>${x[1]}</span><small>${x[2]}</small></button>`).join('');
    $('#mobileNav').innerHTML=html;
    $('#sideNav').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('');
    $('#pageTitle').textContent=tabs.find(x=>x[0]===tab)[2];
  }

  function metric(icon,label,value,note,neg){return `<article class="card metric"><i>${icon}</i><span>${label}</span><b class="${neg?'neg':''}">${value}</b><small>${note}</small></article>`}
  function empty(title,text,action){return `<div class="empty"><b>${esc(title)}</b>${esc(text)}${action?`<br><br><button class="outline" onclick="${action}">＋ Add New</button>`:''}</div>`}

  // ---------- Financial calculations (shared, single source of truth) ----------
  function financials(){
    const grossSales=state.invoices.reduce((s,x)=>s+x.lines.reduce((a,l)=>a+l.qty*l.rate,0),0);
    const discounts=state.invoices.reduce((s,x)=>s+num(x.discount),0);
    const goodReturns=state.returns.filter(x=>x.condition==='Good');
    const damagedReturns=state.returns.filter(x=>x.condition==='Damaged');
    const returnRefunds=state.returns.reduce((s,x)=>s+x.refund,0);
    const netSales=grossSales-discounts-returnRefunds;
    const cogsSold=state.invoices.reduce((s,x)=>s+x.cogs,0);
    const cogsReturnedGood=goodReturns.reduce((s,x)=>s+x.cost*x.qty,0);
    const damagedLoss=damagedReturns.reduce((s,x)=>s+x.cost*x.qty,0);
    const netCogs=cogsSold-cogsReturnedGood;
    const grossProfit=netSales-netCogs;
    const buying=state.purchases.reduce((s,x)=>s+x.total,0);
    const stockValue=state.products.reduce((s,x)=>s+x.stock*x.cost,0);
    const expenseTotal=state.expenses.reduce((s,x)=>s+num(x.amount),0);
    const expenseByCategory={};
    state.expenses.forEach(x=>{expenseByCategory[x.category]=(expenseByCategory[x.category]||0)+num(x.amount)});
    const netProfit=grossProfit-expenseTotal-damagedLoss;
    return {grossSales,discounts,returnRefunds,netSales,cogsSold,cogsReturnedGood,damagedLoss,netCogs,grossProfit,buying,stockValue,expenseTotal,expenseByCategory,netProfit,invoiceCount:state.invoices.length};
  }

  function render(){
    const app=$('#app');
    const f=financials();
    if(tab==='dashboard')app.innerHTML=dashboard(f);
    else if(tab==='vendors')app.innerHTML=recordsPage('Vendor Database','Manage suppliers.',"openVendor()",vendorTable());
    else if(tab==='inventory')app.innerHTML=recordsPage('Inventory','Stock quantity comes only from Purchase Orders. Use "+ New" here just to set up product name, cost and price.',"openProduct()",productTable());
    else if(tab==='purchases')app.innerHTML=recordsPage('Purchase Orders','Unlimited items with automatic inventory updates.',"openPurchase()",purchaseTable());
    else if(tab==='invoices')app.innerHTML=invoicesPage();
    else if(tab==='returns')app.innerHTML=recordsPage('Sales Returns','Only Good / Resellable items return to stock.',"openReturn()",returnTable());
    else if(tab==='expenses')app.innerHTML=expensesPage(f);
    else if(tab==='targets')app.innerHTML=targetsPage();
    else if(tab==='reports')app.innerHTML=reportsPage(f);
    else if(tab==='settings')app.innerHTML=settingsPage();
  }
  function recordsPage(title,text,action,body){return `<section class="content"><div class="hero"><div><h2>${title}</h2><p>${text}</p></div><button class="primary" onclick="${action}">＋ New</button></div><article class="card">${body}</article></section>`}
  function achieved(t){
    const matches=x=>t.item==='All Products'||x.description===t.item;
    const sold=state.invoices.flatMap(x=>x.lines).filter(matches);
    const soldQty=sold.reduce((s,x)=>s+x.qty,0);
    const soldValue=sold.reduce((s,x)=>s+x.qty*x.rate,0);
    // Net out Good-condition returns so a sale that gets returned doesn't keep counting toward
    // the target — Damaged returns are left in place since the item genuinely was sold (a
    // separate loss is tracked for those, not an un-sale).
    const returnedGood=state.returns.filter(r=>r.condition==='Good'&&(t.item==='All Products'||r.item===t.item));
    const returnedQty=returnedGood.reduce((s,r)=>s+r.qty,0);
    const returnedValue=returnedGood.reduce((s,r)=>s+r.refund,0);
    return {qty:Math.max(0,soldQty-returnedQty),value:Math.max(0,soldValue-returnedValue)};
  }

  function dashboard(f){
    const rows=state.targets.map(t=>({...t,...achieved(t)})),max=Math.max(1,...rows.flatMap(x=>[x.quantityTarget,x.qty]));
    const lowStock=state.products.filter(p=>p.stock<=p.reorder);
    const totalTarget=rows.reduce((s,x)=>s+x.quantityTarget,0),totalAchieved=rows.reduce((s,x)=>s+x.qty,0);
    const pendingInvoices=state.invoices.filter(x=>x.paymentType&&x.paymentStatus!=='Paid');
    const pendingByShop={};
    pendingInvoices.forEach(x=>{
      if(!pendingByShop[x.shopId])pendingByShop[x.shopId]={shopId:x.shopId,name:x.customer,total:0,invoices:[]};
      pendingByShop[x.shopId].total+=x.total;
      pendingByShop[x.shopId].invoices.push(x);
    });
    const pendingShops=Object.values(pendingByShop).sort((a,b)=>b.total-a.total);
    const totalPending=pendingInvoices.reduce((s,x)=>s+x.total,0);
    return `<section class="content">
      <div class="hero"><div><h2>Business Overview</h2><p>Smartphone-ready sales and inventory workspace.</p></div></div>
      <div class="cards">
        ${metric('↗','Net Sales',money(f.netSales),f.invoiceCount+' invoices, after discounts &amp; returns')}
        ${metric('↓','Purchasing',money(f.buying),state.purchases.length+' orders')}
        ${metric('□','Inventory Value',money(f.stockValue),state.products.length+' products'+(lowStock.length?' · '+lowStock.length+' low stock':''))}
        ${metric('◎','Net Profit',money(f.netProfit),'After COGS, expenses &amp; damage',f.netProfit<0)}
      </div>
      ${pendingShops.length?`<article class="card panel"><div class="panel-head"><div><h3>Pending Payments</h3><p>Credit and Cheque invoices not yet marked as paid. Total pending: <b>${money(totalPending)}</b></p></div><span class="badge-count">${pendingInvoices.length}</span></div><div class="table-wrap"><table><tr><th>Shop Name</th><th>Pending Amount</th><th>Invoices</th></tr>${pendingShops.map(s=>`<tr><td><a href="javascript:void(0)" onclick="viewCustomer('${s.shopId}')" style="color:var(--teal);font-weight:800;text-decoration:underline">${esc(s.name)}</a></td><td><b>${money(s.total)}</b></td><td>${s.invoices.map(x=>`<a href="javascript:void(0)" onclick="viewInvoice('${x.id}')" style="color:var(--teal);font-weight:700;text-decoration:underline;margin-right:8px">${x.id}</a>`).join('')}</td></tr>`).join('')}</table></div></article>`:''}
      ${lowStock.length?`<article class="card panel"><div class="panel-head"><div><h3>Low Stock Alert</h3><p>${lowStock.length} product(s) at or below reorder level.</p></div><span class="badge-count">${lowStock.length}</span></div><div class="table-wrap"><table><tr><th>Product</th><th>Stock</th><th>Reorder Level</th><th></th></tr>${lowStock.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="status low">${p.stock}</span></td><td>${p.reorder}</td><td><button class="edit" onclick="openProduct('${p.id}')">Restock</button></td></tr>`).join('')}</table></div></article>`:''}
      <article class="card chart">
        <div class="panel-head"><div><h3>Target vs Achievement</h3><p>Achievement updates automatically from invoices. Each item has its own light/neon color pair.</p></div></div>
        ${rows.length?`<div class="chart-area">${rows.slice(0,8).map((x,i)=>{const[lightC,neonC]=CHART_PALETTE[i%CHART_PALETTE.length];return `<div class="group"><div class="pair"><div class="bar" style="height:${Math.max(4,x.quantityTarget/max*100)}%;background:${lightC}"><em>${x.quantityTarget}</em></div><div class="bar" style="height:${Math.max(4,x.qty/max*100)}%;background:${neonC};box-shadow:0 0 8px ${neonC}99"><em>${x.qty}</em></div></div><small>${esc(x.item)}</small></div>`}).join('')}</div>`:empty('No targets yet','Add a target to display the chart.',"openTarget()")}
      </article>
      ${rows.length?`<article class="card panel">
        <div class="panel-head"><div><h3>Overall Target vs Achievement</h3><p>Total across all items.</p></div></div>
        ${donutChart(totalTarget,totalAchieved)}
      </article>`:''}
    </section>`;
  }
  function donutChart(target,achieved){
    const pct=target?Math.min(100,Math.round(achieved/target*100)):0;
    const r=52,circ=2*Math.PI*r,offset=circ*(1-pct/100);
    return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="#dde7e4" stroke-width="16"/>
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="url(#donutGrad)" stroke-width="16" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 70 70)"/>
        <defs><linearGradient id="donutGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5fe8d5"/><stop offset="100%" stop-color="#0f8f83"/></linearGradient></defs>
        <text x="70" y="65" text-anchor="middle" font-size="24" font-weight="800" fill="#0f2430">${pct}%</text>
        <text x="70" y="85" text-anchor="middle" font-size="11" fill="#6d818a">Achieved</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:#dde7e4;display:inline-block"></span><span>Target: <b>${target}</b></span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:#0f8f83;display:inline-block"></span><span>Achieved: <b>${achieved}</b></span></div>
      </div>
    </div>`;
  }

  function clearDamaged(id){
    const p=state.products.find(x=>x.id===id);
    if(!p)return;
    if(!confirm(`Clear ${p.damaged} damaged unit(s) of "${p.name}"? This just removes the damage flag and does not affect stock.`))return;
    log('Inventory','Damage Cleared',id,p.damaged+' units');
    p.damaged=0;
    persist();render();toast('Damage return cleared');
  }

  function paymentBadge(x){
    if(!x.paymentType)return '<span class="status bad">Not set</span>';
    const isPaid=x.paymentStatus==='Paid';
    let label=x.paymentType;
    if(x.paymentType==='Cheque'&&x.chequeStatus)label+=' · '+x.chequeStatus;
    // Credit invoices are always flagged in red so they stand out at a glance, whether paid or pending.
    if(x.paymentType==='Credit'){if(isPaid)label+=' · Paid';return `<span class="status credit">${esc(label)}</span>`;}
    return `<span class="status ${isPaid?'good':'low'}">${esc(label)}</span>`;
  }
  function shopNetSales(shopId){
    const invs=state.invoices.filter(x=>x.shopId===shopId);
    const grossTotal=invs.reduce((s,x)=>s+x.total,0);
    const invIds=new Set(invs.map(x=>x.id));
    const refunds=state.returns.filter(r=>invIds.has(r.invoiceId)).reduce((s,r)=>s+r.refund,0);
    return {invs,grossTotal,refunds,netTotal:Math.max(0,grossTotal-refunds)};
  }

      {n:'Cheque Tracking',r:[['Invoice','Shop ID','Shop Name','Cheque Number','Bank','Amount','Received Date','Status','Passed Date','Returned Date','Days in Clearing'],...state.invoices.filter(x=>x.paymentType==='Cheque').map(x=>{const status=x.chequeStatus||'Pending';const clearedDate=x.chequePassedDate||x.chequeReturnedDate;const days=clearedDate&&x.chequeReceivedDate?dayDiffGB(x.chequeReceivedDate,clearedDate):'';return[x.id,x.shopId,x.customer,x.chequeNumber||'',x.chequeBank||'',x.total,x.chequeReceivedDate||'',status,x.chequePassedDate||'',x.chequeReturnedDate||'',days]})]},
      {n:'Customers',r:[['Shop ID','Name','Total Invoices','Net Sales'],...state.retailers.map(x=>{const {invs,netTotal}=shopNetSales(x.id);return[x.id,x.name,invs.length,netTotal]})]},
      {n:'Vendors',r:[['Vendor ID','Name','Phone','WhatsApp','Terms','Address','Bank Name','Branch','Account Number','Account Holder','Notes'],...state.vendors.map(x=>[x.id,x.name,x.phone,x.whatsapp,x.terms,x.address,x.bankName,x.bankBranch,x.accountNumber,x.accountHolder,x.notes])]},
      {n:'Purchase Orders',r:(()=>{const rows=[['PO','Vendor','Batch Number','Date','Item','Qty','Rate','Line Total','PO Total']];state.purchases.forEach(x=>{x.lines.forEach((l,i)=>rows.push([x.id,x.vendor,x.batchNo||'',x.date,l.description,l.qty,l.rate,l.qty*l.rate,i===0?x.total:'']))});rows.push(['','','','','','','','Grand Total',state.purchases.reduce((s,x)=>s+x.total,0)]);return rows})()},
      {n:'Inventory',r:[['Product ID','Product','Stock','Reorder Level','Cost','Selling','Stock Value'],...state.products.map(x=>[x.id,x.name,x.stock,x.reorder,x.cost,x.price,x.stock*x.cost])]},
      {n:'Batches',r:[['Batch Number','Product','PO','Date','Original Qty','Remaining Qty','Rate','Remaining Value'],...state.batches.map(b=>[b.batchNo,b.productName,b.poId,b.date,b.qty,b.remainingQty,b.rate,b.remainingQty*b.rate])]},
      {n:'Returns',r:[['Return','Invoice','Item','Qty','Condition','Reason','Refund','Cost Impact','Date'],...state.returns.map(x=>[x.id,x.invoiceId,x.item,x.qty,x.condition,x.reason||'',x.refund,x.cost*x.qty,x.date])]},
      {n:'Expenses',r:[['Expense ID','Date','Category','Description','Amount'],...state.expenses.map(x=>[x.id,x.date,x.category,x.note,x.amount])]},
      {n:'Target vs Achievement',r:[['Target','Item','Qty Target','Qty Achieved','Value Target','Value Achieved'],...state.targets.map(x=>{const a=achieved(x);return[x.id,x.item,x.quantityTarget,a.qty,x.valueTarget,a.value]})]},
      {n:'Profit and Loss',r:pnlRows(f)},
      {n:'Activity History',r:[['Time','Module','Action','Record'],...state.audit.map(x=>[x.time,x.module,x.action,x.record])]}
    ];
  }

  function pnlRows(f){
    const rows=[['Profit & Loss Statement','']];
    rows.push(['Generated',new Date().toLocaleString('en-GB')]);
    rows.push(['',''])
    rows.push(['REVENUE','']);
    rows.push(['Gross Sales',f.grossSales]);
    rows.push(['Less: Discounts',-f.discounts]);
    rows.push(['Less: Sales Returns (Refunds)',-f.returnRefunds]);
    rows.push(['Net Sales',f.netSales]);
    rows.push(['',''])
    rows.push(['COST OF GOODS SOLD','']);
    rows.push(['Cost of Items Sold',f.cogsSold]);
    rows.push(['Less: Cost of Good Returns',-f.cogsReturnedGood]);
    rows.push(['Net COGS',f.netCogs]);
    rows.push(['',''])
    rows.push(['GROSS PROFIT',f.grossProfit]);
    rows.push(['Gross Margin %',f.netSales?Math.round(f.grossProfit/f.netSales*1000)/10:0]);
    rows.push(['',''])
    rows.push(['OPERATING EXPENSES','']);
    Object.entries(f.expenseByCategory).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>rows.push([cat,amt]));
    rows.push(['Total Operating Expenses',f.expenseTotal]);
    rows.push(['',''])
    rows.push(['OTHER LOSSES','']);
    rows.push(['Damaged / Written-off Returns',f.damagedLoss]);
    rows.push(['',''])
    rows.push(['NET PROFIT',f.netProfit]);
    rows.push(['Net Margin %',f.netSales?Math.round(f.netProfit/f.netSales*1000)/10:0]);
    rows.push(['',''])
    rows.push(['REFERENCE (not part of P&L)','']);
    rows.push(['Total Purchasing (cash out on stock)',f.buying]);
    rows.push(['Current Inventory Value',f.stockValue]);
    return rows;
  }

  function xls(name,sets){
    const xe=v=>String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    const sheets=sets.map(s=>`<Worksheet ss:Name="${xe(s.n).slice(0,31)}"><Table>${s.r.map(r=>`<Row>${r.map(v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${xe(v)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`).join('');
    download(name+'.xls','<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+sheets+'</Workbook>','application/vnd.ms-excel');
  }

  function download(name,content,type){
    // Try the File System Access API first (showSaveFilePicker) — supported on Chrome 132+ for
    // Android/WebView. This triggers Android's real native download UI (progress notification,
    // saved to Downloads), which is exactly the experience the old <a download> trick could never
    // reliably produce in a wrapped WebView. Falls through to sharing/blob methods if unsupported.
    if(typeof window.showSaveFilePicker==='function'){
      (async()=>{
        try{
          const handle=await window.showSaveFilePicker({suggestedName:name});
          const writable=await handle.createWritable();
          await writable.write(new Blob([content],{type}));
          await writable.close();
          toast('Saved: '+name);
        }catch(err){
          // User cancelled the picker, or the API failed silently — fall back to sharing
          if(err&&err.name==='AbortError'){toast('Save cancelled',true);return}
          downloadViaShareOrBlob(name,content,type);
        }
      })();
      return;
    }
    downloadViaShareOrBlob(name,content,type);
  }
  function downloadViaShareOrBlob(name,content,type){
    // Wrapped WebView APKs (e.g. Appilix) cannot reliably save blob: downloads through Android's
    // real Download Manager. Try native file-sharing first (keeps the correct filename/extension for
    // both .json and .xls). If that's unavailable, fall back per file type: JSON can be shared as
    // plain text (still useful), while .xls needs to stay a real file, so it opens in a page the
    // user can save manually as a last resort.
    try{
      const blob=new Blob([content],{type});
      const file=(typeof File!=='undefined')?new File([blob],name,{type}):null;
      if(navigator.share&&file){
        const canShareFiles=!navigator.canShare||navigator.canShare({files:[file]});
        if(canShareFiles){
          const result=navigator.share({files:[file],title:name});
          if(result&&typeof result.then==='function'){
            result.then(()=>toast('Choose where to save: '+name)).catch(()=>downloadFallbackByType(name,content,type));
          }else{
            toast('Choose where to save: '+name);
          }
          return;
        }
      }
    }catch(e){/* fall through */}
    downloadFallbackByType(name,content,type);
  }
  function downloadFallbackByType(name,content,type){
    const isJson=type==='application/json';
    if(isJson&&navigator.share){
      try{
        const result=navigator.share({title:name,text:content});
        if(result&&typeof result.then==='function'){
          result.then(()=>toast('Choose an app to save "'+name+'" (e.g. Drive, Notes, Files)')).catch(()=>fallbackDownload(name,content,type));
        }else{
          toast('Choose an app to save "'+name+'" (e.g. Drive, Notes, Files)');
        }
        return;
      }catch(e){/* fall through */}
    }
    fallbackDownload(name,content,type);
  }
  function fallbackDownload(name,content,type){
    try{
      const blob=new Blob([content],{type});
      if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,name);toast('Saved: '+name);return}
      const u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download=name;a.rel='noopener';a.style.display='none';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},1000);
      // Note: a.click() on a blob URL can silently do nothing in some restricted WebViews without
      // throwing an error, so we can't be certain this actually saved anything. Settings → Data Backup
      // has no separate confirmation step, so we tell the user plainly what to check.
      toast('Download attempted: '+name+' — if it did not appear in Downloads/notifications, try again or use Share instead');
    }catch(err){
      openContentInNewTab(name,content,err);
    }
  }
  function openContentInNewTab(name,content,err){
    // Last-resort fallback for WebView wrappers that block both file-sharing and blob downloads:
    // open the raw content in a new tab so the user can select-all/copy and paste it into a
    // file manager, notes app, or text editor to save manually.
    try{
      const w=window.open('','_blank');
      if(w){
        w.document.write('<p style="font:13px sans-serif;color:#333;padding:12px 12px 0">Long-press below, tap "Select All", then "Copy" — then paste into a Notes/Files app and save as <b>'+esc(name)+'</b>.</p><pre style="white-space:pre-wrap;word-break:break-word;font:11px monospace;padding:12px;user-select:text">'+esc(content)+'</pre>');
        w.document.title=name;
        toast('Download blocked — opened '+name+' in a new tab. Copy the content from there.',true);
      }else{
        toast('Could not download or open '+name+' — check app permissions.',true);
      }
    }catch(err2){
      toast('Download failed: '+((err&&err.message)||'unknown error'),true);
    }
  }
  function backup(scope){const payload=scope==='all'?{version:2,createdAt:new Date().toISOString(),...state}:{version:2,createdAt:new Date().toISOString(),scope,data:{[scope]:state[scope]}};download(scope==='all'?'IMS_Full_Backup.json':`IMS_${scope}_Backup.json`,JSON.stringify(payload,null,2),'application/json')}
  function restoreFile(e){
    const f=e.target.files[0],scope=$('#restoreScope').value;
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        let text=String(r.result||'').trim();
        if(text.charCodeAt(0)===0xFEFF)text=text.slice(1); // strip BOM some Android pickers add
        if(!text)throw Error('The selected file is empty');
        const p=JSON.parse(text),d=p.data||p;
        if(scope==='all'){
          if(!d.company||!Array.isArray(d.invoices)||!Array.isArray(d.products))throw Error('Invalid full backup file');
          const merged=structuredClone(fresh);
          Object.keys(fresh).forEach(k=>{if(d[k]!==undefined)merged[k]=d[k]});
          state=merged;
        }else{
          if(d[scope]===undefined)throw Error('Selected data type not found in this file');
          if(Array.isArray(fresh[scope])&&!Array.isArray(d[scope]))throw Error('Backup format does not match '+scope);
          state[scope]=d[scope];
        }
        log('Backup','Restored',scope,'Restored from JSON file');
        persist();render();toast('Backup restored successfully');
      }catch(err){toast(err.message||'Invalid backup file — make sure you selected a JSON file exported from this app',true)}
    };
    r.onerror=()=>toast('Could not read the selected file — try picking it again',true);
    r.readAsText(f);
    e.target.value='';
  }

  function saveProduct(e,id){
    e.preventDefault();
    const f=new FormData(e.target),name=(f.get('name')||'').trim();
    if(!name)return toast('Product name is required',true);
    const cost=num(f.get('cost')),price=num(f.get('price')),reorder=num(f.get('reorder'));
    if(cost<0||price<0||reorder<0)return toast('Values cannot be negative',true);
    const data={name,reorder,cost,price};
    if(id){
      const rec=state.products.find(x=>x.id===id);
      if(!rec)return toast('Product no longer exists',true);
      const oldName=rec.name;
      Object.assign(rec,data);
      if(oldName!==name){
        // Renaming a product must also update every record that references it by name — this app
        // matches products across batches/invoices/purchases/targets/returns by name string, not
        // a stable ID, so a rename that doesn't propagate leaves old records "orphaned" (invisible
        // to invoicing, targets, etc.) even though the product itself still exists.
        state.batches.forEach(b=>{if(b.productName===oldName)b.productName=name});
        state.targets.forEach(t=>{if(t.item===oldName)t.item=name});
        state.purchases.forEach(po=>po.lines.forEach(l=>{if(l.description===oldName)l.description=name}));
        state.invoices.forEach(inv=>inv.lines.forEach(l=>{if(l.description===oldName)l.description=name}));
        state.returns.forEach(r=>{if(r.item===oldName)r.item=name});
        rec.stock=totalAvailableQty(name);
        log('Inventory','Renamed',id,`"${oldName}" → "${name}"`);
      }else{
        log('Inventory','Updated',id);
      }
    }else{
      const newId='PRD-'+String(state.products.length+1).padStart(3,'0');state.products.push({id:newId,...data,stock:0});log('Inventory','Created',newId);
    }
    persist();closeModal();render();toast('Product saved');
  }

  // ---------- Batch helpers ----------
  function availableBatches(productName){
    return state.batches.filter(b=>b.productName===productName&&b.remainingQty>0).sort((a,b)=>new Date(a.date.split('/').reverse().join('-'))-new Date(b.date.split('/').reverse().join('-')));
  }
  function totalAvailableQty(productName){
    return availableBatches(productName).reduce((s,b)=>s+b.remainingQty,0);
  }
  // Given a product and quantity, consume oldest batches first (FIFO) unless a specific batchNo is forced.
  function planBatchConsumption(productName,qty,forcedBatchNo){
    const batches=availableBatches(productName);
    if(forcedBatchNo){
      const b=batches.find(x=>x.batchNo===forcedBatchNo);
      if(!b||b.remainingQty<qty)return null;
      return [{batchNo:forcedBatchNo,qty}];
    }
    let remaining=qty,plan=[];
    for(const b of batches){
      if(remaining<=0)break;
      const take=Math.min(b.remainingQty,remaining);
      plan.push({batchNo:b.batchNo,qty:take});
      remaining-=take;
    }
    return remaining>0?null:plan;
  }
  function lineRows(type){
    return editor.map((x,i)=>{
      const itemField=type==='invoice'

        :`<input value="${esc(x.description)}" placeholder="Item" list="poItemSuggestions" autocomplete="off" oninput="lineChange(${i},'description',this.value,'purchase')">`;
      const mainRow=`<div class="line">${itemField}<input type="number" min="1" step="1" value="${x.qty||''}" placeholder="Qty" oninput="lineChange(${i},'qty',this.value)"><input type="number" min="0" step="0.01" value="${x.rate||''}" placeholder="Rate" oninput="lineChange(${i},'rate',this.value)"><button type="button" onclick="removeLine(${i})">×</button></div>`;
      if(type!=='invoice'||!x.description)return mainRow;
      const batches=availableBatches(x.description);
      if(!batches.length)return mainRow+`<p class="err" style="margin:-4px 0 8px">No stock batches available for this item</p>`;
      const batchRow=`<div class="grid" style="margin:-4px 0 8px"><label style="margin:0">Batch (auto: oldest first)<select onchange="lineChange(${i},'batchNo',this.value)"><option value="">Auto (FIFO — oldest batch first)</option>${batches.map(b=>`<option value="${b.batchNo}" ${x.batchNo===b.batchNo?'selected':''}>${b.batchNo} — Qty ${b.remainingQty} @ ${money(b.rate)}</option>`).join('')}</select></label></div>`;
      return mainRow+batchRow;
    }).join('')+(type==='purchase'?`<datalist id="poItemSuggestions">${state.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>`:'');
  }

  // ---------- Purchases ----------
  function generateBatchNumber(date){
    const name=(state.company.name||'').trim();
    const initials=(name.match(/[A-Za-z]+/g)||[]).map(w=>w[0].toUpperCase()).join('').slice(0,3).padEnd(3,'X');
    const [d,m,y]=date.split('/');
    const prefix=initials+d+m+y.slice(-2);
    const existingNumbers=new Set(state.batches.filter(b=>b.batchNo.startsWith(prefix)).map(b=>b.batchNo));
    const nextSeq=String(existingNumbers.size+1).padStart(3,'0');
    return prefix+nextSeq;
  }
  function openPurchase(id){
    const x=state.purchases.find(p=>p.id===id);
    editor=x?structuredClone(x.lines):[{description:'',qty:'',rate:''}];
    const today=new Date().toLocaleDateString('en-GB');
    const batchNo=x?x.batchNo:generateBatchNumber(today);
    show(`<h2>${x?'Edit '+x.id:'New Purchase Order'}</h2><p>Unlimited items; inventory increases automatically. All items in this order share one batch number.</p>
    <form class="form" onsubmit="savePurchase(event,'${id||''}')">
      <input id="editorType" type="hidden" value="purchase">
      <div class="grid">
        <label>Vendor<input name="vendor" value="${esc(x?.vendor??state.vendors[0]?.name??'')}" required></label>
        <label>Batch Number<input name="batchNo" class="auto" value="${esc(batchNo)}" required></label>
      </div>
      <div class="line-editor"><div class="panel-head"><b>Items</b><button type="button" class="outline" onclick="addLine()">＋ Item</button></div><div id="lineRows">${lineRows('purchase')}</div><div class="total"><span>Total</span><b id="orderTotal">${money(editor.reduce((s,z)=>s+z.qty*z.rate,0))}</b></div></div>
      <div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Save PO</button></div>
    </form>`);
  }
  function applyPO(lines,m,batchNo,poId,date){
    lines.forEach(l=>{
      let p=state.products.find(x=>x.name===l.description);
      if(!p&&m>0){
        p={id:'PRD-'+String(state.products.length+1).padStart(3,'0'),name:l.description,stock:0,cost:l.rate,price:l.rate,reorder:0};
        state.products.push(p);
      }
      if(!p)return;
      if(m>0){
        state.batches.push({batchNo,productName:l.description,poId,qty:l.qty,remainingQty:l.qty,rate:l.rate,date});
        p.cost=l.rate;
        p.stock=Math.max(0,p.stock+l.qty);
      }else{
        // reverse: remove batches created by this PO for this product
        state.batches=state.batches.filter(b=>!(b.poId===poId&&b.productName===l.description));
        p.stock=Math.max(0,p.stock-l.qty);
      }
    });
  }
  function savePurchase(e,id){
    e.preventDefault();
    const valid=editor.filter(x=>x.description&&x.qty>0);
    const f=new FormData(e.target),vendor=(f.get('vendor')||'').trim();
    const batchNo=(f.get('batchNo')||'').trim();
    if(!vendor)return toast('Vendor name is required',true);
    if(!batchNo)return toast('Batch number is required',true);
    if(!valid.length)return toast('Add at least one valid item',true);
    if(id){
      const x=state.purchases.find(x=>x.id===id);
      if(!x)return toast('Purchase order no longer exists',true);
      // Per-item check: only block if the NEW quantity for an item would go below
      // how much of that item's batch has already been consumed (sold/returned elsewhere).
      // Items that are untouched, or whose new qty is still >= consumed qty, are always fine —
      // even if other items in the same PO have been consumed.
      for(const line of valid){
        const b=state.batches.find(bt=>bt.poId===id&&bt.productName===line.description);
        if(!b)continue; // new item added to this PO — fine
        const consumedQty=b.qty-b.remainingQty;
        if(line.qty<consumedQty){
          return toast(`Cannot reduce "${line.description}" below ${consumedQty} — that much has already been sold or returned from this batch.`,true);
        }
      }
      const newNames=new Set(valid.map(l=>l.description));
      for(const oldLine of x.lines){
        if(newNames.has(oldLine.description))continue;
        const b=state.batches.find(bt=>bt.poId===id&&bt.productName===oldLine.description);
        if(b&&b.remainingQty<b.qty){
          return toast(`Cannot remove "${oldLine.description}" — some of its stock from this batch has already been sold or returned.`,true);
        }
      }
      // Update batches in place so consumption history (remainingQty) is preserved.
      const oldNames=new Set(x.lines.map(l=>l.description));
      valid.forEach(line=>{
        const b=state.batches.find(bt=>bt.poId===id&&bt.productName===line.description);
        if(b){
          const consumedQty=b.qty-b.remainingQty;
          b.qty=line.qty;
          b.remainingQty=line.qty-consumedQty;
          b.rate=line.rate;
          b.batchNo=batchNo;
        }else{
          state.batches.push({batchNo,productName:line.description,poId:id,qty:line.qty,remainingQty:line.qty,rate:line.rate,date:x.date});
        }
        let p=state.products.find(pr=>pr.name===line.description);
        if(!p){p={id:'PRD-'+String(state.products.length+1).padStart(3,'0'),name:line.description,stock:0,cost:line.rate,price:line.rate,reorder:0};state.products.push(p)}
        p.cost=line.rate;
      });
      // Remove batch records for items dropped from the PO (already confirmed unconsumed above)
      oldNames.forEach(name=>{
        if(!newNames.has(name)){
          state.batches=state.batches.filter(bt=>!(bt.poId===id&&bt.productName===name));
        }
      });
      state.products.forEach(p=>{p.stock=totalAvailableQty(p.name)});
      x.vendor=vendor;x.lines=valid;x.total=valid.reduce((s,z)=>s+z.qty*z.rate,0);x.batchNo=batchNo;
      log('Purchasing','Updated',id);
    }else{
      const newId='PO-'+String(state.purchases.length+1).padStart(4,'0');
      const date=new Date().toLocaleDateString('en-GB');
      const x={id:newId,vendor,date,lines:valid,total:valid.reduce((s,z)=>s+z.qty*z.rate,0),batchNo};
      state.purchases.push(x);applyPO(valid,1,batchNo,newId,date);
      log('Purchasing','Created',newId);
    }
    persist();closeModal();render();toast('Purchase, batch and inventory updated');
  }

  // ---------- Invoices ----------
  // Always computes a fresh Shop ID that doesn't collide with any existing retailer,
  // checking actual IDs rather than array length (safe even after deletions/imports).
  function nextShopId(){
    let n=state.retailers.length+1;
    let id='OTSR'+String(n).padStart(4,'0');
    while(state.retailers.some(r=>r.id===id)){
      n++;
      id='OTSR'+String(n).padStart(4,'0');
    }
    return id;
  }

  function toggleChequeFields(val){
    const wrap=$('#chequeFieldsWrap');
    if(!wrap)return;
    const show=val==='Cheque';
    wrap.style.display=show?'grid':'none';
    wrap.querySelectorAll('input,select').forEach(el=>{if(el.name==='chequeNumber'||el.name==='chequeBank')el.required=show;});
  }
  function onShopNameInput(val){
    const match=state.retailers.find(r=>r.name===val);
    const choiceField=$('#customerChoiceField');
    const shopIdField=$('#shopIdField');
    const addressField=document.querySelector('input[name="shopAddress"]');
    const contactField=document.querySelector('input[name="shopContact"]');
    const whatsappField=document.querySelector('input[name="shopWhatsapp"]');
    if(match){
      if(choiceField)choiceField.value=match.id;
      if(shopIdField)shopIdField.value=match.id;
      if(addressField)addressField.value=match.address||'';
      if(contactField)contactField.value=match.phone||'';
      if(whatsappField)whatsappField.value=match.whatsapp||'';
    }else{
      if(choiceField)choiceField.value='__manual__';
      // keep existing auto-generated Shop ID for a genuinely new shop name; leave detail fields as-is
      // so the user's own typing isn't wiped out while entering a new shop's info
    }
  }
  function saveInvoice(e,id){
    e.preventDefault();
    const valid=editor.filter(x=>x.description&&x.qty>0);
    if(!valid.length)return toast('Add at least one valid item',true);
    const fCheck=new FormData(e.target);
    const paymentType=fCheck.get('paymentType');
    if(!paymentType)return toast('Please select a Payment Type before saving',true);
    const chequeNumber=(fCheck.get('chequeNumber')||'').trim();
    const chequeBank=fCheck.get('chequeBank')||'';
    const chequeReceivedDate=fCheck.get('chequeReceivedDate')||'';
    if(paymentType==='Cheque'&&!chequeNumber)return toast('Please enter the Cheque Number',true);
    if(paymentType==='Cheque'&&!chequeBank)return toast('Please select the Bank',true);
    const old=state.invoices.find(x=>x.id===id);
    // Restore old invoice's batch consumption first so we compute availability fairly during an edit
    if(old)restoreInvoiceBatches(old);
    // Validate & plan batch consumption for each line
    const plans=[];
    for(const line of valid){
      const plan=planBatchConsumption(line.description,line.qty,line.batchNo||null);
      if(!plan){
        if(old)consumeInvoiceBatches(old); // put old consumption back since we're aborting
        return toast('Insufficient stock in batch(es) for: '+line.description,true);
      }
      plans.push({line,plan});
    }
    // Apply new consumption
    plans.forEach(({line,plan})=>{
      plan.forEach(p=>{
        const b=state.batches.find(x=>x.batchNo===p.batchNo&&x.productName===line.description);
        if(b)b.remainingQty-=p.qty;
      });
    });
    // Sync product.stock totals from batches
    state.products.forEach(p=>{p.stock=totalAvailableQty(p.name)});
    const f=new FormData(e.target),discount=num(f.get('discount'));
    if(discount<0)return toast('Discount cannot be negative',true);
    const total=Math.max(0,valid.reduce((s,x)=>s+x.qty*x.rate,0)-discount);
    const cogs=valid.reduce((s,x)=>s+(state.products.find(p=>p.name===x.description)?.cost||0)*x.qty,0);
    const customerChoice=f.get('customerChoice');
    const shopAddress=(f.get('shopAddress')||'').trim();
    const shopContact=(f.get('shopContact')||'').trim();
    const shopWhatsapp=(f.get('shopWhatsapp')||'').trim();
    let sid=f.get('shopId'),customer;
    if(customerChoice==='__manual__'){
      customer=($('#shopNameSearch').value||'').trim();
      if(!customer)return toast('Shop name is required',true);
      // If the typed name matches an existing shop exactly (case-insensitive), reuse that shop's ID
      const match=state.retailers.find(r=>r.name.toLowerCase()===customer.toLowerCase());
      if(match){
        sid=match.id;
        match.name=customer;
        if(shopAddress)match.address=shopAddress;
        if(shopContact)match.phone=shopContact;
        if(shopWhatsapp)match.whatsapp=shopWhatsapp;
      }else{
        // Always compute a fresh, guaranteed-unique Shop ID from the current state at save time —
        // never trust a value cached in the DOM field, since it can go stale (autofill, re-renders,
        // multiple invoices created back-to-back) and cause duplicate Shop IDs.
        sid=nextShopId();
        state.retailers.push({id:sid,name:customer,address:shopAddress,phone:shopContact,whatsapp:shopWhatsapp});
      }
    }else{
      const r=state.retailers.find(x=>x.id===customerChoice);
      if(!r)return toast('Selected shop no longer exists',true);
      sid=r.id;
      customer=r.name;
      if(shopAddress)r.address=shopAddress;
      if(shopContact)r.phone=shopContact;
      if(shopWhatsapp)r.whatsapp=shopWhatsapp;
    }
    // Attach batch consumption plan to each line for later restoration/reporting
    const linesWithBatches=valid.map((line,i)=>({...line,batches:plans[i].plan}));
    let savedId;
    // Payment status: Cash defaults to Paid; Credit/Cheque default to Pending.
    // If editing and the payment type hasn't changed, keep the existing paymentStatus/chequeStatus
    // (e.g. don't reset a cheque that's already marked Pass back to Pending just because other
    // invoice details were edited).
    let paymentStatus,chequeStatus;
    if(old&&old.paymentType===paymentType){
      paymentStatus=old.paymentStatus;
      chequeStatus=old.chequeStatus;
    }else{
      paymentStatus=paymentType==='Cash'?'Paid':'Pending';
      chequeStatus=paymentType==='Cheque'?'Pending':undefined;
    }
    if(old){
      Object.assign(old,{customer,shopId:sid,lines:linesWithBatches,discount,total,cogs,paymentType,paymentStatus,chequeStatus,
        chequeNumber:paymentType==='Cheque'?chequeNumber:undefined,
        chequeBank:paymentType==='Cheque'?chequeBank:undefined,
        chequeReceivedDate:paymentType==='Cheque'?(chequeReceivedDate?fromIsoDate(chequeReceivedDate):old.chequeReceivedDate):undefined,
        chequePassedDate:paymentType==='Cheque'?old.chequePassedDate:undefined,
        chequeReturnedDate:paymentType==='Cheque'?old.chequeReturnedDate:undefined});
      log('Invoices','Updated',id);
      savedId=id;
    }else{
      const newId='INV-'+String(state.invoices.length+1).padStart(4,'0');
      state.invoices.push({id:newId,shopId:sid,customer,date:new Date().toLocaleDateString('en-GB'),lines:linesWithBatches,discount,total,cogs,paymentType,paymentStatus,chequeStatus,
        chequeNumber:paymentType==='Cheque'?chequeNumber:undefined,
        chequeBank:paymentType==='Cheque'?chequeBank:undefined,
        chequeReceivedDate:paymentType==='Cheque'?(chequeReceivedDate?fromIsoDate(chequeReceivedDate):new Date().toLocaleDateString('en-GB')):undefined});
      log('Invoices','Created',newId);
      savedId=newId;
    }
    persist();
    tab='invoices';renderNav();render();
    toast('Invoice, inventory and targets updated');
    confirmPrint(savedId);
  }
  function restoreInvoiceBatches(inv){
    inv.lines.forEach(line=>{
      (line.batches||[]).forEach(p=>{
        const b=state.batches.find(x=>x.batchNo===p.batchNo&&x.productName===line.description);
        if(b)b.remainingQty+=p.qty;
      });
    });
    state.products.forEach(p=>{p.stock=totalAvailableQty(p.name)});
  }
  function consumeInvoiceBatches(inv){
    inv.lines.forEach(line=>{
      (line.batches||[]).forEach(p=>{
        const b=state.batches.find(x=>x.batchNo===p.batchNo&&x.productName===line.description);
        if(b)b.remainingQty-=p.qty;
      });
    });
    state.products.forEach(p=>{p.stock=totalAvailableQty(p.name)});
  }
  function confirmPrint(invId){
    show(`<h2>Invoice Saved</h2><p>Do you want to print this invoice now?</p>
    <div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">No, go to Invoices</button><button class="primary" onclick="closeModal();printInvoice('${invId}')">Yes, Print</button></div>`);
  }
  function deleteInvoice(id){
    if(!confirm('Delete invoice '+id+'? Stock will be restored to its original batches. This cannot be undone.'))return;
    const x=state.invoices.find(i=>i.id===id);
    if(!x)return;
    restoreInvoiceBatches(x);
    state.invoices=state.invoices.filter(i=>i.id!==id);
    log('Invoices','Deleted',id);
    persist();render();toast('Invoice deleted and stock restored');
  }

  // ---------- Payment status management ----------
  function markInvoicePaid(id){
    const x=state.invoices.find(i=>i.id===id);
    if(!x)return toast('Invoice not found',true);
    if(!confirm(`Mark ${id} as Paid? This confirms the ${x.paymentType.toLowerCase()} payment has been received.`))return;
    x.paymentStatus='Paid';
    log('Invoices','Payment Received',id);
    persist();render();toast('Payment marked as received');
  }
  function markInvoicePending(id){
    const x=state.invoices.find(i=>i.id===id);
    if(!x)return toast('Invoice not found',true);
    if(!confirm(`Mark ${id} as Pending again?`))return;
    x.paymentStatus='Pending';
    log('Invoices','Payment Reverted to Pending',id);
    persist();render();toast('Payment marked as pending');
  }
  function setChequeStatus(id,status){
    const x=state.invoices.find(i=>i.id===id);
    if(!x)return toast('Invoice not found',true);
    if(!confirm(`Mark the cheque for ${id} as "${status}"?`))return;
    x.chequeStatus=status;
    // A passed cheque means payment is received; a returned (bounced) cheque means the
    // invoice goes back to not-received, exactly as requested.
    x.paymentStatus=status==='Pass'?'Paid':'Pending';
    const today=new Date().toLocaleDateString('en-GB');
    if(status==='Pass'){x.chequePassedDate=today;x.chequeReturnedDate=undefined;}
    else if(status==='Returned'){x.chequeReturnedDate=today;x.chequePassedDate=undefined;}
    log('Invoices','Cheque '+status,id);
    persist();render();toast(status==='Pass'?'Cheque marked as passed — payment received':'Cheque marked as returned — payment now pending');
  }

  // ---------- Returns ----------
  function openReturn(){
    if(!state.invoices.length)return toast('Create an invoice first',true);
    const inv=state.invoices[state.invoices.length-1];
    show(`<h2>Record Return</h2><p>Only Good items return to inventory. A reason is required.</p>
    <form class="form" onsubmit="saveReturn(event)">
      <label>Invoice<select name="invoice" onchange="returnItems(this.value)">${state.invoices.map(x=>`<option value="${x.id}" ${x.id===inv.id?'selected':''}>${x.id} · ${esc(x.customer)}</option>`).join('')}</select></label>
      <label>Item<select id="returnItem" name="item">${inv.lines.map(x=>`<option>${esc(x.description)}</option>`).join('')}</select></label>
      <div class="grid"><label>Quantity<input name="qty" type="number" min="1" step="1" placeholder="Qty" required></label><label>Condition<select name="condition"><option>Good</option><option>Damaged</option></select></label></div>
      <label>Reason for Return (required)<textarea name="reason" placeholder="e.g. Wrong item ordered, customer changed mind, defective on arrival" required></textarea></label>
      <div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Save Return</button></div>
    </form>`);
  }
  function returnItems(id){const x=state.invoices.find(i=>i.id===id);if(x)$('#returnItem').innerHTML=x.lines.map(l=>`<option>${esc(l.description)}</option>`).join('')}
  function saveReturn(e){
    e.preventDefault();
    const f=new FormData(e.target),inv=state.invoices.find(x=>x.id===f.get('invoice'));
    if(!inv)return toast('Invoice not found',true);
    const line=inv.lines.find(x=>x.description===f.get('item'));
    if(!line)return toast('Item not found on invoice',true);
    const qty=num(f.get('qty')),condition=f.get('condition');
    const reason=(f.get('reason')||'').trim();
    if(!reason)return toast('A reason for the return is required',true);
    if(qty<1)return toast('Quantity must be at least 1',true);
    if(qty>line.qty)return toast('Quantity is greater than invoice quantity',true);
    const p=state.products.find(x=>x.name===line.description);
    if(p){
      if(condition==='Good'){
        // return qty back to the batch(es) this line originally drew from, oldest-consumed-first
        let remaining=qty;
        (line.batches||[]).forEach(bc=>{
          if(remaining<=0)return;
          const b=state.batches.find(x=>x.batchNo===bc.batchNo&&x.productName===line.description);
          if(b){const give=Math.min(remaining,bc.qty);b.remainingQty+=give;remaining-=give}
        });
        p.stock=totalAvailableQty(p.name);
      }
      if(condition==='Damaged')p.damaged=(p.damaged||0)+qty;
    }
    const id='RET-'+String(state.returns.length+1).padStart(4,'0');
    state.returns.push({id,invoiceId:inv.id,item:line.description,qty,condition,reason,refund:line.rate*qty,cost:p?.cost||0,date:new Date().toLocaleDateString('en-GB')});
    log('Returns','Created',id);
    // A Good return changes the amount actually owed on this invoice, so if it was already marked
    // Paid, revert it to Pending — the shop's payment needs to be reconciled against the new amount.
    if(condition==='Good'&&inv.paymentStatus==='Paid'){
      inv.paymentStatus='Pending';
      if(inv.paymentType==='Cheque')inv.chequeStatus='Pending';
      log('Invoices','Payment Reverted to Pending (due to return)',inv.id);
    }
    persist();closeModal();render();toast(condition==='Good'?'Return added to stock':'Damaged item recorded — flagged in Inventory');
  }

  // ---------- Expenses ----------
  function openExpense(id){
    const x=state.expenses.find(e=>e.id===id);
    const isManualDefault=!x; // new expense defaults to "Manual Add" being selected; editing selects the real category
    show(`<h2>${x?'Edit Expense':'New Expense'}</h2><p>Recorded expenses reduce Net Profit in the P&amp;L report.</p>
    <form class="form" onsubmit="saveExpense(event,'${id||''}')">
      <label>Category<select id="expenseCategorySelect" name="category" onchange="toggleManualCategory(this.value)"><option value="__manual__">＋ Manual Add New Category</option>${EXPENSE_CATEGORIES().map(c=>`<option ${x?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label id="manualCategoryWrap" style="display:${isManualDefault?'grid':'none'}">New Category Name<input id="manualCategoryInput" type="text" placeholder="Type new category name"><span id="categoryErr" class="err"></span></label>
      <label>Amount<input name="amount" type="number" min="0" step="0.01" value="${x?.amount??''}" required></label>
      <label>Description (optional)<input name="note" value="${esc(x?.note)}" placeholder="e.g. August electricity bill"></label>
      <label>Date<input name="date" type="date" value="${x?toIsoDate(x.date):new Date().toISOString().slice(0,10)}"></label>
      <div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Save Expense</button></div>
    </form>`);
  }
  function toggleManualCategory(val){
    const wrap=$('#manualCategoryWrap');
    wrap.style.display=val==='__manual__'?'grid':'none';
    if(val==='__manual__')$('#manualCategoryInput').focus();
  }
  function toIsoDate(dGB){const[d,m,y]=dGB.split('/');return `${y}-${m}-${d}`}
  function dayDiffGB(dateA,dateB){
    // Both dates in DD/MM/YYYY format. Returns whole days from dateA to dateB.
    const[d1,m1,y1]=dateA.split('/').map(Number);
    const[d2,m2,y2]=dateB.split('/').map(Number);
    const a=new Date(y1,m1-1,d1),b=new Date(y2,m2-1,d2);
    return Math.round((b-a)/(1000*60*60*24));
  }
  function fromIsoDate(iso){const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
  function saveExpense(e,id){
    e.preventDefault();
    const f=new FormData(e.target),amount=num(f.get('amount'));
    if(amount<=0)return toast('Amount must be greater than 0',true);
    let category=f.get('category');
    if(category==='__manual__'){
      const newCat=($('#manualCategoryInput').value||'').trim();
      if(!newCat){$('#categoryErr').textContent='Please type a category name';return}
      const allCats=EXPENSE_CATEGORIES();
      const dup=allCats.find(c=>c.toLowerCase()===newCat.toLowerCase());
      if(dup){$('#categoryErr').textContent=`"${dup}" already exists — please select it from the list instead`;return}
      state.expenseCategories=state.expenseCategories||[];
      state.expenseCategories.push(newCat);
      category=newCat;
      log('Expenses','Category Added',newCat);
    }
    const dateVal=f.get('date')?fromIsoDate(f.get('date')):new Date().toLocaleDateString('en-GB');
    const data={category,amount,note:(f.get('note')||'').trim(),date:dateVal};
    if(id){const rec=state.expenses.find(x=>x.id===id);if(!rec)return toast('Expense no longer exists',true);Object.assign(rec,data);log('Expenses','Updated',id)}
    else{const newId='EXP-'+String(state.expenses.length+1).padStart(4,'0');state.expenses.push({id:newId,...data});log('Expenses','Created',newId)}
    persist();closeModal();render();toast('Expense saved');
  }
  function deleteExpense(id){
    if(!confirm('Delete this expense record?'))return;
    state.expenses=state.expenses.filter(x=>x.id!==id);
    log('Expenses','Deleted',id);
    persist();render();toast('Expense deleted');
  }

  // ---------- Targets ----------

      <div class="grid"><label>Quantity Target<input name="qty" type="number" min="0" step="1" value="${x?.quantityTarget||0}"></label><label>Value Target<input name="value" type="number" min="0" step="0.01" value="${x?.valueTarget||0}"></label></div>
      <div class="modal-actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Save Target</button></div>
    </form>`);

  function saveTarget(e,id){

  // ---------- Settings ----------
  function saveSettings(e){
    e.preventDefault();
    const f=new FormData(e.target);

  function savePrinterSettings(e){

  function uploadLogo(e){
    const file=e.target.files[0];
    if(!file)return;
    if(!file.type.startsWith('image/'))return toast('Please choose an image file',true);
    if(file.size>1024*1024*1.5)return toast('Image too large — please use a file under 1.5MB',true);
    const r=new FileReader();
    r.onload=()=>{
      state.company.logo=r.result;
      log('Settings','Updated','Company logo');
      persist();render();toast('Logo uploaded');
    };
    r.onerror=()=>toast('Could not read image',true);

    e.target.value='';
  }

  function uploadQrCode(e){
