  // ---------- Print ----------
  function printInvoice(id){
    const x=state.invoices.find(i=>i.id===id);
    if(!x)return toast('Invoice not found',true);
    const c=state.company;
    if(c.logo&&c.qrCode){
      buildLogoQrComposite(c.logo,c.qrCode,(composite)=>doPrintInvoice(x,composite));
    }else if(c.logo||c.qrCode){
      resizeSingleImage(c.logo||c.qrCode,(resized)=>doPrintInvoice(x,resized),!c.logo&&!!c.qrCode);
    }else{
      doPrintInvoice(x,null);
    }
  }
  // 58mm thermal printers (ESC/POS standard) have an exact 384px active print width:
  // 48mm printable area x 8 pixels/mm at 203 DPI = 384px. Using this exact width means
  // no extra scaling is needed by the printer app, avoiding any distortion or misalignment.
  const PRINT_WIDTH_PX=384;
  function resizeSingleImage(src,callback,isQr){
    try{
      // QR alone gets a generous square sized well above the ~160px (2cm) minimum reliable scan size,
      // while staying within the printable width.
      const targetSize=isQr?Math.min(220,PRINT_WIDTH_PX):Math.round(PRINT_WIDTH_PX*0.35);
      const img=new Image();
      img.onload=()=>{
        let w,h;
        if(isQr){w=targetSize;h=targetSize}
        else{h=targetSize;w=img.width*(targetSize/img.height)}
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(w);canvas.height=Math.round(h);
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,w,h);
        callback(canvas.toDataURL('image/jpeg',0.8));
      };
      img.onerror=()=>callback(src);
      img.src=src;
    }catch(e){
      callback(src);
    }
  }
  // Combine logo (left) and QR code (right) into one balanced side-by-side image,
  // sized to exactly fill the printer's native 384px width — no scaling needed on the printer side.
  // QR gets a generous square area comfortably above the ~160px (2cm) minimum reliable-scan size.
  function buildLogoQrComposite(logoSrc,qrSrc,callback){
    try{
      const qrSize=180; // well above the 2cm/~160px minimum reliable QR scan size
      const gap=16;
      const logoW=PRINT_WIDTH_PX-qrSize-gap;
      let loaded=0,logoImg=new Image(),qrImg=new Image();
      const onBothLoaded=()=>{
        const logoH=Math.min(qrSize,logoImg.height*(logoW/logoImg.width));
        const canvas=document.createElement('canvas');
        canvas.width=PRINT_WIDTH_PX;
        canvas.height=qrSize;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        // vertically center the logo within the row height, QR fills the full row height
        ctx.drawImage(logoImg,0,(qrSize-logoH)/2,logoW,logoH);
        ctx.drawImage(qrImg,logoW+gap,0,qrSize,qrSize);
        let dataUrl=canvas.toDataURL('image/jpeg',0.75);
        if(dataUrl.length>90000){
          // Intent extras have a strict ~1MB ceiling; back off quality (not QR pixel size) if needed
          dataUrl=canvas.toDataURL('image/jpeg',0.55);
        }
        callback(dataUrl);
      };
      logoImg.onload=()=>{loaded++;if(loaded===2)onBothLoaded()};
      qrImg.onload=()=>{loaded++;if(loaded===2)onBothLoaded()};
      logoImg.onerror=()=>callback(logoSrc);
      qrImg.onerror=()=>callback(logoSrc);
      logoImg.src=logoSrc;
      qrImg.src=qrSrc;
    }catch(e){
      callback(logoSrc);
    }
  }
  function buildTopHeaderImage(c,callback){
    try{
      const printSettings=c.printHeaderFooter!==false;
      if(!printSettings||!c.customHeader)return callback(null);
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d');
      const padding=8;
      canvas.width=PRINT_WIDTH_PX;
      canvas.height=40+padding*2;
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#000';ctx.textAlign='center';
      ctx.font='bold 24px Arial';
      ctx.fillText(c.customHeader,PRINT_WIDTH_PX/2,padding+28,PRINT_WIDTH_PX-16);
      callback(canvas.toDataURL('image/jpeg',0.75));
    }catch(e){
      callback(null);
    }
  }
  function buildCompanyDetailsImage(c,callback){
    try{
      const lines=[];
      if(c.name)lines.push({text:c.name,font:'bold 40px "Times New Roman"'});
      if(c.address)lines.push({text:c.address,font:'26px "Times New Roman"'});
      const contactBits=[c.br?'BR: '+c.br:'',c.phone||''].filter(Boolean).join('   ');
      if(contactBits)lines.push({text:contactBits,font:'26px "Times New Roman"'});
      if(!lines.length)return callback(null);
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d');
      const lineHeight=40,padding=8;
      canvas.width=PRINT_WIDTH_PX;
      canvas.height=lines.length*lineHeight+padding*2;
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#000';ctx.textAlign='center';
      lines.forEach((l,i)=>{
        ctx.font=l.font;
        ctx.fillText(l.text,PRINT_WIDTH_PX/2,padding+lineHeight*i+28,PRINT_WIDTH_PX-16);
      });
      callback(canvas.toDataURL('image/jpeg',0.75));
    }catch(e){
      callback(null);
    }
  }
  function doPrintInvoice(x,imageDataUrl){
    const c=state.company;
    buildTopHeaderImage(c,(topHeaderImg)=>{
      buildCompanyDetailsImage(c,(detailsImg)=>{
        finishPrintInvoice(x,imageDataUrl,topHeaderImg,detailsImg);
      });
    });
  }
  // Formats a number as 000,000.00 for printed money values (thousands-separated)
  function printMoney(n){
    return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function buildInvoiceBodyImage(x,c,callback){
    try{
      const subtotal=x.lines.reduce((s,l)=>s+l.qty*l.rate,0);
      const fontNormal='20px Arial';
      const fontBold='bold 20px Arial';
      const padding=10,rowH=28,dashH=20;
      const badgeSize=20,badgeGap=8; // custom-drawn number badge (not an emoji) for guaranteed rendering on every device
      const rows=[]; // {type:'row'|'line'|'dash'|'item', ...}
      const addRow=(left,right,bold)=>rows.push({type:'row',left,right,bold:!!bold});
      const addLine=(text,bold,center)=>rows.push({type:'line',text,bold:!!bold,center:!!center});
      const addDash=()=>rows.push({type:'dash'});
      const addItem=(num,text)=>rows.push({type:'item',num,text});
      addDash();
      addRow('Invoice',x.id);
      addRow('Date',x.date);
      addRow('Shop ID',x.shopId);
      addRow('Shop Name',x.customer,true);
      if(x.paymentType)addRow('Payment',x.paymentType+(x.paymentType==='Cheque'&&x.chequeStatus?' ('+x.chequeStatus+')':''));
      addDash();
      x.lines.forEach((l,i)=>{
        addItem(i+1,l.description);
        addRow(`${l.qty} x ${printMoney(l.rate)}`,printMoney(l.qty*l.rate));
      });
      addDash();
      addRow('Subtotal',printMoney(subtotal));
      if(x.discount)addRow('Discount','-'+printMoney(x.discount));
      addRow('TOTAL',printMoney(x.total),true);
      const printSettings=c.printHeaderFooter!==false;
      if(printSettings){
        addDash();
        addLine(c.customFooter||'Powered by IMS Apps',false,true);
        if(c.customFooter2)addLine(c.customFooter2,false,true);
        if(c.customFooter3)addLine(c.customFooter3,false,true);
      }
      const totalHeight=rows.reduce((s,r)=>s+(r.type==='dash'?dashH:rowH),0)+padding*2;
      const canvas=document.createElement('canvas');
      canvas.width=PRINT_WIDTH_PX;
      canvas.height=totalHeight;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#000';
      let y=padding;
      rows.forEach(r=>{
        if(r.type==='dash'){
          ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.setLineDash([4,3]);
          ctx.beginPath();ctx.moveTo(padding,y+dashH/2);ctx.lineTo(PRINT_WIDTH_PX-padding,y+dashH/2);ctx.stroke();
          ctx.setLineDash([]);
          y+=dashH;
        }else if(r.type==='row'){
          ctx.font=r.bold?fontBold:fontNormal;
          ctx.textAlign='left';
          ctx.fillText(r.left,padding,y+20);
          ctx.textAlign='right';
          ctx.fillText(r.right,PRINT_WIDTH_PX-padding,y+20);
          y+=rowH;
        }else if(r.type==='item'){
          // Draw a filled circle badge with the item number inside — custom-drawn shapes,
          // not an emoji sequence, so it renders identically on every device/printer.
          const cx=padding+badgeSize/2,cy=y+rowH/2-2;
          ctx.fillStyle='#000';
          ctx.beginPath();ctx.arc(cx,cy,badgeSize/2,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#fff';
          ctx.font='bold 13px Arial';
          ctx.textAlign='center';
          ctx.fillText(String(r.num),cx,cy+4);
          ctx.fillStyle='#000';
          ctx.font=fontNormal;
          ctx.textAlign='left';
          let text=r.text;
          const textX=padding+badgeSize+badgeGap;
          const maxWidth=PRINT_WIDTH_PX-padding-textX;
          while(ctx.measureText(text).width>maxWidth&&text.length>1){
            text=text.slice(0,-2)+'…';
          }
          ctx.fillText(text,textX,y+20);
          y+=rowH;
        }else if(r.type==='line'){
          ctx.font=r.bold?fontBold:fontNormal;
          ctx.textAlign=r.center?'center':'left';
          let text=r.text;
          // truncate if it doesn't fit the printable width
          const maxWidth=PRINT_WIDTH_PX-padding*2;
          while(ctx.measureText(text).width>maxWidth&&text.length>1){
            text=text.slice(0,-2)+'…';
          }
          ctx.fillText(text,r.center?PRINT_WIDTH_PX/2:padding,y+20);
          y+=rowH;
        }
      });
      callback(canvas.toDataURL('image/jpeg',0.75));
    }catch(e){
      callback(null);
    }
  }
  function finishPrintInvoice(x,imageDataUrl,topHeaderImg,detailsImg){
    const c=state.company;
    // Bluetooth Print (mate.bluetoothprint) tag-based format: <BAF>Content
    // B: bold (0/1) | A: align (0=left,1=center,2=right) | F: format (0=normal,1=doubleH,2=doubleH+W,3=doubleW)
    let str='';
    const line=(content,b,a,f)=>{str+=`<${b}${a}${f??0}>${content}\n`};
    const img=(dataUrl)=>{if(dataUrl){const b64=dataUrl.split(',')[1]||dataUrl;str+=`<IMAGE>1#${b64}\n`}};
    const printSettings=c.printHeaderFooter!==false;
    // 1. Custom header text prints above everything, including the logo
    if(topHeaderImg){
      img(topHeaderImg);
    }else if(printSettings&&c.customHeader){
      line(c.customHeader,1,1); // safety-net fallback only if canvas rendering failed
    }
    // 2. Logo / QR code
    img(imageDataUrl);
    // 3. Company name, address, BR, phone
    if(detailsImg){
      img(detailsImg);
    }else{
      if(c.name)line(c.name,1,1,1);
      if(c.address)line(c.address,0,1);
      if(c.br)line('BR: '+c.br,0,1);
      if(c.phone)line(c.phone,0,1);
    }
    buildInvoiceBodyImage(x,c,(bodyImg)=>{
      img(bodyImg);
      try{
        shareToBluetoothPrint(str);
      }catch(err){
        toast('Could not open printer app: '+(err.message||'unknown error'),true);
      }
    });
  }
  function shareToBluetoothPrint(str){
    if(navigator.share){
      try{
        const result=navigator.share({text:str});
        if(result&&typeof result.then==='function'){
          result.then(()=>{
            toast('Sent to Share menu — choose Bluetooth Print');
          }).catch(()=>{
            fallbackShareIntent(str);
          });
        }else{
          // navigator.share exists but doesn't return a real Promise in this WebView — assume it triggered the share sheet
          toast('Sent to Share menu — choose Bluetooth Print');
        }
      }catch(e){
        fallbackShareIntent(str);
      }
    }else{
      fallbackShareIntent(str);
    }
  }
  function fallbackShareIntent(str){
    // Android share-sheet intent URL as a fallback for WebViews without navigator.share
    const intentUrl='intent:#Intent;action=android.intent.action.SEND;type=text/plain;S.android.intent.extra.TEXT='+encodeURIComponent(str)+';package=mate.bluetoothprint;end';
    const a=document.createElement('a');
    a.href=intentUrl;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{try{document.body.removeChild(a)}catch(e){}},1000);
    toast('Sending to Bluetooth Print — make sure it is connected to your printer');
  }

  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  renderNav();render();
  </script>
