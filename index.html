<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142b3a">
  <title>IMS Sales & Inventory</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{--navy:#0f2333;--navy2:#1c3d4f;--teal:#0f8f83;--tealDark:#0b6b62;--mint:#d9f0ea;--bg:#eef3f1;--card:#ffffff;--line:#dde7e4;--ink:#0f2430;--muted:#6d818a;--amber:#c88b31;--red:#b23a2b}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;-webkit-appearance:none}
    input,select,textarea{-webkit-appearance:none}
    .top{height:64px;background:linear-gradient(135deg,var(--card),var(--mint) 180%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:10;gap:10px}
    .top small{font-size:9.5px;letter-spacing:.15em;color:var(--tealDark);font-weight:800}
    .top h1{font-size:19px;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;color:var(--navy)}
    .primary,.outline,.dark,.danger{min-height:44px;border-radius:9px;padding:0 14px;font-weight:800;white-space:nowrap}
    .primary{background:linear-gradient(135deg,var(--teal),var(--tealDark));border:0;color:#edfffb;box-shadow:0 4px 12px rgba(15,143,131,.28)}
    .outline{background:var(--card);border:1px solid #9fb7b3;color:var(--ink)}
    .dark{background:var(--navy);border:0;color:#e7f6f3}
    .danger{background:#f6e2dd;border:1px solid #d8a996;color:#8a3822}
    .content{padding:15px;max-width:1300px;margin:auto}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}
    .hero h2{margin:0 0 5px;font-size:22px}
    .hero p{margin:0;color:var(--muted);font-size:13.5px}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px rgba(15,36,48,.06),0 1px 3px rgba(15,36,48,.05)}
    .metric{padding:14px;min-height:120px}
    .metric i{width:36px;height:36px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:var(--teal);font-style:normal;font-size:18px}
    .metric span{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
    .metric b{font-size:17px;display:block;word-break:break-word}
    .metric b.neg{color:var(--red)}
    .metric small{color:#849397}
    .report-subject{display:block;color:var(--navy);font-size:17px;font-weight:800;margin:10px 0 5px}
    .panel{margin-top:13px;padding:15px}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
    .panel-head h3{margin:0 0 4px;font-size:16.5px}
    .panel-head p{margin:0;color:var(--muted);font-size:12.5px}
    .table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:640px;border-collapse:collapse}
    th{padding:10px;text-align:left;background:#e6eeec;color:#6f8387;text-transform:uppercase;font-size:9.5px;letter-spacing:.06em;white-space:nowrap}
    td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;color:#546a70}
    td b{color:var(--ink)}
    tr.total-row td{font-weight:800;color:var(--ink);background:#e9f2ef}
    .edit{border:1px solid #96b7b0;background:var(--mint);color:#0d6961;border-radius:7px;padding:7px 9px;font-size:11.5px;font-weight:800;margin:2px}
    .del{border:1px solid #d8a996;background:#f6e2dd;color:#8a3822;border-radius:7px;padding:7px 9px;font-size:11.5px;font-weight:800;margin:2px}
    .empty{text-align:center;padding:45px 20px;color:var(--muted)}
    .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
    .status{padding:5px 8px;border-radius:20px;font-size:10.5px;font-weight:800;white-space:nowrap}
    .good{background:#d5ece6;color:#087165}
    .bad{background:#f1dfc2;color:#8b5d1b}
    .low{background:#f6e2dd;color:#8a3822}
    .nav{position:fixed;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,var(--navy2),var(--navy));display:flex;overflow-x:auto;z-index:20;-webkit-overflow-scrolling:touch;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
    .nav button{min-width:64px;flex:1 0 auto;border:0;background:transparent;color:#8ba5ab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-bottom:4px;transition:color .15s}
    .nav button.active{color:#5fe8d5}
    .nav button.active span{text-shadow:0 0 12px rgba(95,232,213,.5)}
    .nav span{font-size:19px}
    .nav small{font-size:9.5px}
    .chart{padding:15px;margin-top:13px}
    .chart-area{height:210px;display:flex;gap:14px;align-items:flex-end;overflow-x:auto;border-bottom:1px solid #9dafac;padding:15px 8px 0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 48px,rgba(90,115,118,.12) 49px);-webkit-overflow-scrolling:touch}
    .group{height:100%;min-width:66px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
    .pair{height:165px;display:flex;align-items:flex-end;gap:4px}
    .bar{width:21px;border-radius:5px 5px 1px 1px;min-height:5px;position:relative}
    .bar.target{background:#9fb7b3}
    .bar.actual{background:var(--teal)}
    .bar em{position:absolute;top:-16px;width:100%;text-align:center;font-size:8px;font-style:normal;font-weight:800;white-space:nowrap}
    .group>small{width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
    .progress{height:7px;background:#cbd8d5;border-radius:10px;overflow:hidden;min-width:80px}
    .progress i{display:block;height:100%;background:var(--teal)}
    dialog{border:0;padding:0;background:transparent;width:100%;max-width:720px;margin:auto 0 0;max-height:94vh}
    dialog::backdrop{background:rgba(10,28,38,.68)}
    .modal{background:var(--card);border-radius:18px 18px 0 0;padding:20px 15px;max-height:94vh;overflow:auto}
    .modal h2{margin:0 0 5px;font-size:20px}
    .modal>p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
    .close{float:right;width:34px;height:34px;border:0;border-radius:50%;font-size:20px;background:var(--mint);color:var(--ink)}
    .form{display:grid;gap:13px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    label{display:grid;gap:6px;color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    input,select,textarea{height:42px;border:1px solid #abc2bd;background:#e7efed;border-radius:8px;padding:0 10px;color:var(--ink);width:100%}
    textarea{height:80px;padding-top:10px}
    .auto{background:var(--mint);font-weight:800;color:#0e665f}
    .hint{font-size:12px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
    .err{color:var(--red);font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
    .line-editor{border:1px solid var(--line);border-radius:10px;padding:10px}
    .line{display:grid;grid-template-columns:1fr 60px 82px 32px;gap:6px;margin-bottom:7px}
    .line button{border:0;border-radius:7px;background:#f6e2dd;color:#8a3822;font-weight:800}
    .total{display:flex;justify-content:space-between;background:var(--navy);color:#e8faf7;border-radius:8px;padding:14px;margin-top:10px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:-20px;background:var(--card);padding:12px 0 18px}
    .toast{position:fixed;bottom:calc(82px + env(safe-area-inset-bottom));left:14px;right:14px;background:var(--navy);color:#e8faf7;padding:13px;border-radius:10px;text-align:center;z-index:50;font-size:13.5px}
    .toast.err-toast{background:#7a2c1c}
    .desktop{display:none}
    .settings-grid{display:grid;gap:12px}
    .legend{font-size:12px;color:var(--muted)}
    .pnl-section{margin-top:18px}
    .pnl-section h4{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal)}
    .logo-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
    .logo-preview{width:72px;height:72px;border-radius:12px;background:var(--mint);border:1px dashed #9fb7b3;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
    .logo-preview img{width:100%;height:100%;object-fit:contain}
    .logo-preview span{font-size:10.5px;color:var(--muted);text-align:center;padding:4px}
    .logo-actions{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
    .logo-upload-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border-radius:8px;background:var(--teal);color:#edfffb;font-weight:800;font-size:13.5px;padding:0 14px;cursor:pointer;width:fit-content}
    .pnl-row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
    .pnl-row.sub{padding-left:14px;color:var(--muted);font-size:13px}
    .pnl-row.subtotal{font-weight:800;color:var(--ink);border-bottom:2px solid var(--line)}
    .pnl-row.grand{font-weight:900;font-size:16px;background:var(--navy);color:#e8faf7;border-radius:8px;padding:12px;border:0;margin-top:6px}
    .pnl-row.grand.neg{background:var(--red)}
    .badge-count{background:var(--mint);color:var(--teal);border-radius:20px;padding:2px 8px;font-size:10.5px;font-weight:800}
    @media(min-width:800px){
      body{padding:0 0 0 220px}
      .desktop{display:block}
      .side{position:fixed;left:0;top:0;bottom:0;width:220px;background:linear-gradient(180deg,var(--navy2),var(--navy));padding:24px 15px;color:#d8e8e6;overflow-y:auto}
      .brand{font-size:19px;font-weight:900;margin:0 10px 30px}
      .side button{display:flex;width:100%;border:0;background:transparent;color:#adc2c6;padding:12px;border-radius:9px;margin-bottom:4px;text-align:left}
      .side button.active{background:var(--navy2);color:#79dfd0}
      .nav{display:none}
      .top{height:78px;padding:0 28px}
      .content{padding:25px 28px}
      .cards{grid-template-columns:repeat(4,1fr)}
      .metric{min-height:115px}
      .grid{grid-template-columns:1fr 1fr}
      dialog{margin:auto;max-width:760px}
      .modal{border-radius:16px;padding:24px}
      .settings-grid{grid-template-columns:1fr 1fr}
      .chart-area{height:250px}
      .pair{height:200px}
    }
  </style>
</head>
<body>
  <aside class="side desktop"><div class="brand">IMS<br><small>Business Manager</small></div><div id="sideNav"></div></aside>
  <header class="top"><div><small>BUSINESS WORKSPACE</small><h1 id="pageTitle">Dashboard</h1></div><button class="primary" onclick="openInvoice()">＋ Invoice</button></header>
  <main id="app"></main>
  <nav class="nav" id="mobileNav"></nav>
  <dialog id="dialog"><div class="modal" id="modal"></div></dialog>
  <div id="toast" class="toast" hidden></div>
  <script>
  const tabs=[['dashboard','▦','Dashboard'],['invoices','▤','Invoices'],['vendors','◇','Vendors'],['purchases','↓','Purchasing'],['inventory','□','Inventory'],['returns','↺','Returns'],['expenses','＄','Expenses'],['targets','◎','Targets'],['reports','↗','Reports'],['settings','⚙','Settings']];
  const EXPENSE_CATEGORIES=['Rent','Salaries & Wages','Utilities (Electricity/Water)','Transport & Fuel','Communication','Marketing & Advertising','Repairs & Maintenance','Office Supplies','Bank Charges & Fees','Taxes & Licenses','Other'];
  const STORAGE_KEY='ims_mobile_data_v2';
  const fresh={company:{name:'',address:'',br:'',phone:'',logo:'',printerWidth:'58',printerName:'',printerNote:''},retailers:[],vendors:[],products:[],purchases:[],invoices:[],returns:[],expenses:[],targets:[],audit:[]};
  let state=loadState(),tab='dashboard',editor=[];

  function loadState(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      const parsed=raw?JSON.parse(raw):null;
      const s=parsed&&typeof parsed==='object'?parsed:structuredClone(fresh);
      Object.keys(fresh).forEach(k=>{if(s[k]===undefined)s[k]=structuredClone(fresh[k])});
      return s;
    }catch(e){
      console.error('State load failed, starting fresh:',e);
      return structuredClone(fresh);
    }
  }

  const $=s=>document.querySelector(s);
  const money=n=>'LKR '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
  const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};

  function persist(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
    catch(e){toast('Could not save — storage may be full',true)}
  }
  function toast(t,isErr){const e=$('#toast');e.textContent=(isErr?'⚠ ':'✓ ')+t;e.className='toast'+(isErr?' err-toast':'');e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>e.hidden=true,2600)}
  function log(module,action,record,details){state.audit.unshift({time:new Date().toLocaleString('en-GB'),module,action,record:record||'',details:details||''});if(state.audit.length>500)state.audit.length=500}
  function setTab(t){tab=t;renderNav();render()}
  function renderNav(){
    const html=tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')"><span>${x[1]}</span><small>${x[2]}</small></button>`).join('');
    $('#mobileNav').innerHTML=html;
    $('#sideNav').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('');
    $('#pageTitle').textContent=tabs.find(x=>x[0]===tab)[2];
  }

  function metric(icon,label,value,note,neg){return `<article class="card metric"><i>${icon}</i><span>${label}</span><b class="${neg?'neg':''}">${value}</b><small>${note}</small></article>`}
  function empty(title,text,action){return `<div class="empty"><b>${esc(title)}</b>${esc(text)}${action?`<br><br><button class="outline" onclick="${action}">＋ Add New</button>`:''}</div>`}

  // ---------- Financial calculations (shared, single source of truth) ----------
  function financials(){
    const grossSales=state.invoices.reduce((s,x)=>s+x.lines.reduce((a,l)=>a+l.qty*l.rate,0),0);
    const discounts=state.invoices.reduce((s,x)=>s+num(x.discount),0);
    const goodReturns=state.returns.filter(x=>x.condition==='Good');
    const damagedReturns=state.returns.filter(x=>x.condition==='Damaged');
    const returnRefunds=state.returns.reduce((s,x)=>s+x.refund,0);
    const netSales=grossSales-discounts-returnRefunds;
    const cogsSold=state.invoices.reduce((s,x)=>s+x.cogs,0);
    const cogsReturnedGood=goodReturns.reduce((s,x)=>s+x.cost*x.qty,0);
    const damagedLoss=damagedReturns.reduce((s,x)=>s+x.cost*x.qty,0);
    const netCogs=cogsSold-cogsReturnedGood;
    const grossProfit=netSales-netCogs;
    const buying=state.purchases.reduce((s,x)=>s+x.total,0);
    const stockValue=state.products.reduce((s,x)=>s+x.stock*x.cost,0);
    const expenseTotal=state.expenses.reduce((s,x)=>s+num(x.amount),0);
    const expenseByCategory={};
    state.expenses.forEach(x=>{expenseByCategory[x.category]=(expenseByCategory[x.category]||0)+num(x.amount)});
    const netProfit=grossProfit-expenseTotal-damagedLoss;
    return {grossSales,discounts,returnRefunds,netSales,cogsSold,cogsReturnedGood,damagedLoss,netCogs,grossProfit,buying,stockValue,expenseTotal,expenseByCategory,netProfit,invoiceCount:state.invoices.length};
  }

  function render(){
    const app=$('#app');
    const f=financials();
    if(tab==='dashboard')app.innerHTML=dashboard(f);
    else if(tab==='vendors')app.innerHTML=recordsPage('Vendor Database','Manage suppliers.',"openVendor()",vendorTable());
    else if(tab==='inventory')app.innerHTML=recordsPage('Inventory','Stock quantity comes only from Purchase Orders. Use "+ New" here just to set up product name, cost and price.',"openProduct()",productTable());
    else if(tab==='purchases')app.innerHTML=recordsPage('Purchase Orders','Unlimited items with automatic inventory updates.',"openPurchase()",purchaseTable());
    else if(tab==='invoices')app.innerHTML=recordsPage('Invoices','Shop IDs start from OTSR0001.',"openInvoice()",invoiceTable());
    else if(tab==='returns')app.innerHTML=recordsPage('Sales Returns','Only Good / Resellable items return to stock.',"openReturn()",returnTable());
    else if(tab==='expenses')app.innerHTML=expensesPage(f);
    else if(tab==='targets')app.innerHTML=targetsPage();
    else if(tab==='reports')app.innerHTML=reportsPage(f);
    else if(tab==='settings')app.innerHTML=settingsPage();
  }
  function recordsPage(title,text,action,body){return `<section class="content"><div class="hero"><div><h2>${title}</h2><p>${text}</p></div><button class="primary" onclick="${action}">＋ New</button></div><article class="card">${body}</article></section>`}
  function achieved(t){const a=state.invoices.flatMap(x=>x.lines).filter(x=>t.item==='All Products'||x.description===t.item);return {qty:a.reduce((s,x)=>s+x.qty,0),value:a.reduce((s,x)=>s+x.qty*x.rate,0)}}

  function dashboard(f){
    const rows=state.targets.map(t=>({...t,...achieved(t)})),max=Math.max(1,...rows.flatMap(x=>[x.quantityTarget,x.qty]));
    const lowStock=state.products.filter(p=>p.stock<=p.reorder);
    return `<section class="content">
      <div class="hero"><div><h2>Business Overview</h2><p>Smartphone-ready sales and inventory workspace.</p></div></div>
      <div class="cards">
        ${metric('↗','Net Sales',money(f.netSales),f.invoiceCount+' invoices, after discounts &amp; returns')}
        ${metric('↓','Purchasing',money(f.buying),state.purchases.length+' orders')}
        ${metric('□','Inventory Value',money(f.stockValue),state.products.length+' products'+(lowStock.length?' · '+lowStock.length+' low stock':''))}
        ${metric('◎','Net Profit',money(f.netProfit),'After COGS, expenses &amp; damage',f.netProfit<0)}
      </div>
      ${lowStock.length?`<article class="card panel"><div class="panel-head"><div><h3>Low Stock Alert</h3><p>${lowStock.length} product(s) at or below reorder level.</p></div><span class="badge-count">${lowStock.length}</span></div><div class="table-wrap"><table><tr><th>Product</th><th>Stock</th><th>Reorder Level</th><th></th></tr>${lowStock.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="status low">${p.stock}</span></td><td>${p.reorder}</td><td><button class="edit" onclick="openProduct('${p.id}')">Restock</button></td></tr>`).join('')}</table></div></article>`:''}
      <article class="card chart">
        <div class="panel-head"><div><h3>Target vs Achievement</h3><p>Achievement updates automatically from invoices.</p></div><span class="legend">Grey: Target · Teal: Achievement</span></div>
        ${rows.length?`<div class="chart-area">${rows.slice(0,8).map(x=>`<div class="group"><div class="pair"><div class="bar target" style="height:${Math.max(4,x.quantityTarget/max*100)}%"><em>${x.quantityTarget}</em></div><div class="bar actual" style="height:${Math.max(4,x.qty/max*100)}%"><em>${x.qty}</em></div></div><small>${esc(x.item)}</small></div>`).join('')}</div>`:empty('No targets yet','Add a target to display the chart.',"openTarget()")}
      </article>
    </section>`;
  }

  function vendorTable(){return state.vendors.length?`<div class="table-wrap"><table><tr><th>Vendor ID</th><th>Name</th><th>Phone</th><th>Terms</th><th></th></tr>${state.vendors.map(x=>`<tr><td><b>${x.id}</b></td><td>${esc(x.name)}</td><td>${esc(x.phone)||'—'}</td><td>${esc(x.terms)}</td><td><button class="edit" onclick="openVendor('${x.id}')">Edit</button></td></tr>`).join('')}</table></div>`:empty('No vendors yet','Add your first vendor.',"openVendor()")}

  function productTable(){return state.products.length?`<div class="table-wrap"><table><tr><th>Product</th><th>Stock</th><th>Cost</th><th>Selling</th><th>Value</th><th>Damage Return</th><th></th></tr>${state.products.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${x.id}</small></td><td>${x.stock<=x.reorder?`<span class="status low">${x.stock}</span>`:x.stock}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td>${money(x.stock*x.cost)}</td><td>${x.damaged?`<span class="status bad">Damage Return: ${x.damaged}</span>`:'—'}</td><td><button class="edit" onclick="openProduct('${x.id}')">Edit</button>${x.damaged?`<button class="del" onclick="clearDamaged('${x.id}')">Clear Damage</button>`:''}</td></tr>`).join('')}</table></div>`:empty('No products yet','Create a Purchase Order to add products with opening stock — or add product details here first and stock them later.',"openPurchase()")}
  function clearDamaged(id){
    const p=state.products.find(x=>x.id===id);
    if(!p)return;
    if(!confirm(`Clear ${p.damaged} damaged unit(s) of "${p.name}"? This just removes the damage flag and does not affect stock.`))return;
    log('Inventory','Damage Cleared',id,p.damaged+' units');
    p.damaged=0;
    persist();render();toast('Damage return cleared');
  }

  function pnlRows(f){
    const rows=[['Profit & Loss Statement','']];
    rows.push(['Generated',new Date().toLocaleString('en-GB')]);
    rows.push(['',''])
    rows.push(['REVENUE','']);
    rows.push(['Gross Sales',f.grossSales]);
    rows.push(['Less: Discounts',-f.discounts]);
    rows.push(['Less: Sales Returns (Refunds)',-f.returnRefunds]);
    rows.push(['Net Sales',f.netSales]);
    rows.push(['',''])
    rows.push(['COST OF GOODS SOLD','']);
    rows.push(['Cost of Items Sold',f.cogsSold]);
    rows.push(['Less: Cost of Good Returns',-f.cogsReturnedGood]);
    rows.push(['Net COGS',f.netCogs]);
    rows.push(['',''])
    rows.push(['GROSS PROFIT',f.grossProfit]);
    rows.push(['Gross Margin %',f.netSales?Math.round(f.grossProfit/f.netSales*1000)/10:0]);
    rows.push(['',''])
    rows.push(['OPERATING EXPENSES','']);
    Object.entries(f.expenseByCategory).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>rows.push([cat,amt]));
    rows.push(['Total Operating Expenses',f.expenseTotal]);
    rows.push(['',''])
    rows.push(['OTHER LOSSES','']);
    rows.push(['Damaged / Written-off Returns',f.damagedLoss]);
    rows.push(['',''])
    rows.push(['NET PROFIT',f.netProfit]);
    rows.push(['Net Margin %',f.netSales?Math.round(f.netProfit/f.netSales*1000)/10:0]);
    rows.push(['',''])
    rows.push(['REFERENCE (not part of P&L)','']);
    rows.push(['Total Purchasing (cash out on stock)',f.buying]);
    rows.push(['Current Inventory Value',f.stockValue]);
    return rows;
  }

  function xls(name,sets){

    download(name+'.xls','<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+sheets+'</Workbook>','application/vnd.ms-excel');
  }

  function download(name,content,type){
    try{
      const blob=new Blob([content],{type});
      // Preferred path: works in real browsers and many WebView wrappers with download support
      if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,name);toast('Saved: '+name);return}
      const u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download=name;a.rel='noopener';a.style.display='none';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},1000);
      toast('Download started: '+name);
    }catch(err){
      // Fallback for WebView wrappers that block blob downloads entirely:
      // open the raw content in a new tab so the user can use the browser/app's
      // own "Save page" or share option.
      try{
        const w=window.open('','_blank');
        if(w){
          w.document.write('<pre style="white-space:pre-wrap;word-break:break-word;font:12px monospace;padding:12px">'+esc(content)+'</pre>');
          w.document.title=name;
          toast('Download blocked — opened '+name+' in a new tab. Use Share/Save from there.',true);
        }else{
          toast('Could not download or open '+name+' — check app permissions.',true);
        }
      }catch(err2){

  function backup(scope){const payload=scope==='all'?{version:2,createdAt:new Date().toISOString(),...state}:{version:2,createdAt:new Date().toISOString(),scope,data:{[scope]:state[scope]}};download(scope==='all'?'IMS_Full_Backup.json':`IMS_${scope}_Backup.json`,JSON.stringify(payload,null,2),'application/json')}
  function restoreFile(e){
    const f=e.target.files[0],scope=$('#restoreScope').value;
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result),d=p.data||p;
        if(scope==='all'){
          if(!d.company||!Array.isArray(d.invoices)||!Array.isArray(d.products))throw Error('Invalid full backup file');
          const merged=structuredClone(fresh);
          Object.keys(fresh).forEach(k=>{if(d[k]!==undefined)merged[k]=d[k]});
          state=merged;
        }else{
          if(d[scope]===undefined)throw Error('Selected data type not found in this file');
          if(Array.isArray(fresh[scope])&&!Array.isArray(d[scope]))throw Error('Backup format does not match '+scope);
          state[scope]=d[scope];
        }
        log('Backup','Restored',scope,'Restored from JSON file');
        persist();render();toast('Backup restored successfully');
      }catch(err){toast(err.message||'Invalid backup file',true)}
    };
    r.onerror=()=>toast('Could not read file',true);
    r.readAsText(f);
    e.target.value='';
  }

  function saveInvoice(e,id){
    e.preventDefault();
    const valid=editor.filter(x=>x.description&&x.qty>0);
    if(!valid.length)return toast('Add at least one valid item',true);
    const old=state.invoices.find(x=>x.id===id);
    const available=n=>(state.products.find(p=>p.name===n)?.stock||0)+(old?.lines.filter(l=>l.description===n).reduce((s,l)=>s+l.qty,0)||0);
    for(const n of [...new Set(valid.map(x=>x.description))]){
      if(valid.filter(x=>x.description===n).reduce((s,x)=>s+x.qty,0)>available(n))return toast('Insufficient stock: '+n,true);
    }
    state.products.forEach(p=>{
      const oq=old?.lines.filter(x=>x.description===p.name).reduce((s,x)=>s+x.qty,0)||0;
      const nq=valid.filter(x=>x.description===p.name).reduce((s,x)=>s+x.qty,0);
      p.stock+=oq-nq;
    });
    const f=new FormData(e.target),discount=num(f.get('discount'));
    if(discount<0)return toast('Discount cannot be negative',true);
    const total=Math.max(0,valid.reduce((s,x)=>s+x.qty*x.rate,0)-discount);
    const cogs=valid.reduce((s,x)=>s+(state.products.find(p=>p.name===x.description)?.cost||0)*x.qty,0);
    const sid=f.get('shopId'),customer=(f.get('customer')||'').trim();
    if(!customer)return toast('Customer name is required',true);
    const retailer=state.retailers.find(x=>x.id===sid);
    if(retailer)retailer.name=customer;else state.retailers.push({id:sid,name:customer});
    let savedId;
    if(old){
      Object.assign(old,{customer,lines:valid,discount,total,cogs});
      log('Invoices','Updated',id);
      savedId=id;
    }else{
      const newId='INV-'+String(state.invoices.length+1).padStart(4,'0');
      state.invoices.push({id:newId,shopId:sid,customer,date:new Date().toLocaleDateString('en-GB'),lines:valid,discount,total,cogs});
      log('Invoices','Created',newId);
      savedId=newId;
    }
    persist();
    tab='invoices';renderNav();render();
    toast('Invoice, inventory and targets updated');
    confirmPrint(savedId);
  }

      <tr><td>Subtotal</td><td style="text-align:right"><b>${subtotal.toFixed(2)}</b></td></tr>
      ${x.discount?`<tr><td>Discount</td><td style="text-align:right"><b>-${Number(x.discount).toFixed(2)}</b></td></tr>`:''}
      <tr><td><b>TOTAL</b></td><td style="text-align:right"><b>${x.total.toFixed(2)}</b></td></tr>
      </table>
      <hr>
      <p style="margin:8px 0 0">Powered by IMS Apps<br>Custom Business Software Solutions<br>Call: 0774 422 444</p>
      </body></html>`;
    try{
      const dataUrl='data:text/html,'+encodeURIComponent(html);
      const printUrl='print://escpos.org/escpos/bt/print?srcTp=uri&srcObj=html&numCopies=1&src='+encodeURIComponent(dataUrl);
      const a=document.createElement('a');
      a.href=printUrl;
      a.style.display='none';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{try{document.body.removeChild(a)}catch(e){}},1000);
      toast('Sending to printer — if nothing happens, open ESC POS Print Service and check it\'s connected to your printer');
    }catch(err){
      toast('Could not open printer app: '+(err.message||'unknown error'),true);
    }
  }

  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  renderNav();render();
  </script>
</body>
</html>
